<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f5f0">
<title>我的日语复习库</title>
<style>
:root{--bg:#f7f5f0;--card:#fff;--ink:#252525;--muted:#6d6a64;--accent:#356859;--accent2:#e6efe9;--line:#e7e2d8;--warm:#fff2d8;--red:#a54436}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;line-height:1.55}
header{padding:28px 18px 22px;background:#e9eee6;border-bottom:1px solid var(--line)}
.wrap{max-width:850px;margin:auto}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--accent);font-weight:700}
h1{font-size:27px;line-height:1.25;margin:8px 0}
header p{margin:8px 0 0;color:#555}
main{max-width:850px;margin:0 auto;padding:18px 14px 60px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat strong{display:block;font-size:23px;color:var(--accent)}
.stat span{font-size:12px;color:var(--muted)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:9px}
input,select,textarea,button{font:inherit}
input,select,textarea{width:100%;border:1px solid #d8d2c7;border-radius:10px;padding:11px;background:#fff;color:var(--ink);min-width:0}
textarea{min-height:80px;resize:vertical}
button{border:0;border-radius:10px;padding:10px 13px;background:var(--accent);color:#fff;font-weight:650;cursor:pointer}
button.secondary{background:var(--accent2);color:var(--accent)}
button.light{background:#f3f0e9;color:var(--ink)}
button.danger{background:#f8e8e5;color:var(--red)}
button:active{transform:scale(.98)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.section-title{font-size:17px;margin:20px 2px 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px;margin-bottom:11px}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.tag{font-size:11px;background:var(--accent2);color:var(--accent);padding:4px 8px;border-radius:99px;white-space:nowrap}
.jp{font-size:20px;font-weight:700;line-height:1.5;margin:8px 0}
.cn{color:var(--muted);font-size:14px}
.details{border-top:1px solid var(--line);margin-top:12px;padding-top:11px}
.details p{margin:6px 0}
.hidden{display:none}
.status{font-size:12px;color:var(--muted)}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}
label{display:block;font-size:13px;color:var(--muted);margin:9px 0 5px}
footer{text-align:center;font-size:12px;color:var(--muted);padding:10px}
@media(min-width:620px){.controls{grid-template-columns:2fr 1fr 1fr}.jp{font-size:22px}.panel{padding:18px}}
</style>
</head>
<body>
<header><div class="wrap">
<div class="eyebrow">JAPANESE · DAILY PRACTICE</div>
<h1>我的日语复习库</h1>
<p>少背孤立句子，多练能反复使用的表达模式。</p>
</div></header>
<main>
<div class="stats">
<div class="stat"><strong id="totalCount">0</strong><span>全部句型</span></div>
<div class="stat"><strong id="todoCount">0</strong><span>待复习</span></div>
<div class="stat"><strong id="doneCount">0</strong><span>已掌握</span></div>
</div>
<section class="panel">
<div class="controls">
<input id="search" type="search" placeholder="搜索日语、中文或句型…">
<select id="categoryFilter" aria-label="按类别筛选"><option value="">全部类别</option></select>
<select id="statusFilter" aria-label="按状态筛选"><option value="">全部状态</option><option value="todo">待复习</option><option value="done">已掌握</option></select>
</div>
<div class="actions">
<button id="randomBtn">🎲 随机复习</button>
<button id="showAllBtn" class="secondary">显示全部答案</button>
<button id="hideAllBtn" class="light">收起答案</button>
</div>
</section>
<div class="section-title">练习内容</div>
<div id="cards"></div>
<section class="panel">
<h2 style="font-size:18px;margin:0 0 4px">＋ 添加自己的练习</h2>
<p class="cn">写下你想记住的表达。保存后会出现在复习列表中。</p>
<form id="addForm">
<label for="newCategory">类别</label>
<select id="newCategory"><option>口语句型</option><option>可能形</option><option>逆接・转折</option><option>心情与日常</option><option>自定义</option></select>
<label for="newPattern">句型 / 重点</label>
<input id="newPattern" required placeholder="例如：〜ようとすると">
<label for="newJapanese">日语例句</label>
<textarea id="newJapanese" required placeholder="例如：話そうとすると、言葉が出てこない。"></textarea>
<label for="newChinese">中文意思</label>
<textarea id="newChinese" placeholder="例如：一想开口说话，就说不出来。"></textarea>
<label for="newNote">用法提示</label>
<textarea id="newNote" placeholder="例如：表示正要做某事时，出现了某种情况。"></textarea>
<div class="actions"><button type="submit">保存练习</button></div>
</form>
</section>
<section class="panel">
<h2 style="font-size:18px;margin:0 0 4px">备份与恢复</h2>
<p class="cn">换手机或更换浏览器前，建议先导出备份。数据保存在当前浏览器中，不会自动跨设备同步。</p>
<div class="actions">
<button id="exportBtn" class="secondary">导出备份</button>
<button id="importBtn" class="light">导入备份</button>
<input id="importFile" type="file" accept=".json,application/json" class="hidden">
</div>
</section>
<footer>坚持每天练几句，比一次背很多更重要。</footer>
</main>
<script>
const KEY = "japaneseReviewLibrary_v1";
const starter = [
{id:"a1",category:"口语句型",pattern:"〜ば〜ほど",jp:"間違えるのが心配になればなるほど、口を開けなくなる。",cn:"越担心说错，就越不敢开口。",note:"表示“越……越……”。前后通常使用同一词语或相互关联的表达。",status:"todo"},
{id:"a2",category:"口语句型",pattern:"〜つもりだったのに",jp:"早く寝るつもりだったのに、気づいたらまたスマホを見ていた。",cn:"本来打算早点睡，回过神来却又在看手机。",note:"「のに」表达实际结果和原本预想不一样，常带有遗憾或意外。",status:"todo"},
{id:"a3",category:"口语句型",pattern:"どうすればいいか分からない",jp:"自分の考えをどう説明すればいいか分からない。",cn:"我不知道该怎么解释自己的想法。",note:"把“该怎么做”作为一个整体放进句子里。常用结构：疑问词＋ばいいか分からない。",status:"todo"},
{id:"a4",category:"可能形",pattern:"可能形＋が／を",jp:"日本人の話が聞き取れない。",cn:"我听不懂日本人说的话。",note:"强调能否听懂内容时，常用「話が聞き取れない」。单纯表示没听到声音则可说「聞こえない」。",status:"todo"},
{id:"a5",category:"可能形",pattern:"可能形表达做不到",jp:"言いたいことがうまく伝えられない。",cn:"我没办法顺利表达自己想说的话。",note:"「伝える」的可能形是「伝えられる」。口语中也会听到「伝えれる」，但学习和正式表达建议使用「伝えられる」。",status:"todo"},
{id:"a6",category:"口语句型",pattern:"〜ようとすると",jp:"話そうとすると、何を言えばいいか分からなくなる。",cn:"一想开口说话，就不知道该说什么了。",note:"「意志形＋とすると」表示正要做某事时，发生某种情况；也可以表示尝试做某事。",status:"todo"},
{id:"a7",category:"口语句型",pattern:"〜たほうがいい",jp:"もっと声に出して練習したほうがいい。",cn:"最好多出声练习。",note:"给建议时使用。动词た形＋ほうがいい。否定建议常用「〜ないほうがいい」。",status:"todo"},
{id:"a8",category:"心情与日常",pattern:"〜ないと気になる",jp:"やらなきゃいけないことが終わらないと、ずっと気になる。",cn:"必须做的事情没完成，就会一直惦记着。",note:"「気になる」表示心里在意、放不下。口语里「やらなきゃいけない」是「やらなければいけない」的常见缩略。",status:"todo"},
{id:"a9",category:"心情与日常",pattern:"気づいたら〜ていた",jp:"5分だけ休むつもりだったのに、気づいたら寝てしまっていた。",cn:"本来只打算休息五分钟，回过神来却已经睡着了。",note:"「気づいたら」常用来表达不知不觉发现某个结果已经发生。",status:"todo"},
{id:"a10",category:"逆接・转折",pattern:"〜のは分かっているのに",jp:"早く始めたほうがいいのは分かっているのに、何から始めればいいか迷ってしまう。",cn:"明明知道早点开始比较好，却又纠结该从哪里开始。",note:"「〜のは分かっている」把前面的内容作为已知事实；「のに」引出与预期不符的结果。",status:"todo"},
{id:"a11",category:"口语句型",pattern:"〜ようになる",jp:"前より文を組み立てやすくなってきた。",cn:"我觉得自己比以前更容易组织句子了。",note:"「〜やすくなる」表示变得容易做某事；「〜てきた」强调变化逐渐发展到现在。",status:"todo"},
{id:"a12",category:"心情与日常",pattern:"〜つい〜てしまう",jp:"間違いが心配で、つい頭の中で何度も文を組み立ててしまう。",cn:"因为担心出错，不知不觉就在脑子里反复组织句子。",note:"「つい」表示不由得、忍不住；「〜てしまう」常带有不自觉或遗憾的语气。",status:"todo"}
];
let items = load();
let revealed = new Set();
function load(){try{const v=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(v))return v;}catch(e){}return starter.map(x=>({...x}));}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(items));}catch(e){alert("当前浏览器无法保存数据，请使用“导出备份”保存练习。");}}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function categories(){return [...new Set(items.map(x=>x.category).filter(Boolean))].sort();}
function fillCategories(){const f=document.getElementById("categoryFilter");const old=f.value;f.innerHTML='<option value="">全部类别</option>'+categories().map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join("");if(categories().includes(old))f.value=old;const n=document.getElementById("newCategory");const nold=n.value;n.innerHTML=categories().map(c=>`<option>${esc(c)}</option>`).join("")+'<option>自定义</option>';if(categories().includes(nold))n.value=nold;}
function render(){
 fillCategories();
 const q=document.getElementById("search").value.trim().toLowerCase(),cat=document.getElementById("categoryFilter").value,st=document.getElementById("statusFilter").value;
 const filtered=items.filter(x=>(!q||[x.jp,x.cn,x.pattern,x.note,x.category].some(v=>String(v||"").toLowerCase().includes(q)))&&(!cat||x.category===cat)&&(!st||x.status===st));
 document.getElementById("totalCount").textContent=items.length;
 document.getElementById("todoCount").textContent=items.filter(x=>x.status!=="done").length;
 document.getElementById("doneCount").textContent=items.filter(x=>x.status==="done").length;
 const root=document.getElementById("cards");
 if(!filtered.length){root.innerHTML='<div class="empty">没有找到内容。试试其他关键词或类别。</div>';return;}
 root.innerHTML=filtered.map(x=>{const open=revealed.has(x.id);return `<article class="card" id="card-${esc(x.id)}">
 <div class="card-top"><span class="tag">${esc(x.category||"自定义")}</span><span class="status">${x.status==="done"?"✓ 已掌握":"待复习"}</span></div>
 <div class="jp">${esc(x.jp)}</div><div class="cn">重点：${esc(x.pattern)}</div>
 <div class="actions"><button class="secondary" data-action="reveal" data-id="${esc(x.id)}">${open?"收起解释":"查看解释"}</button><button class="${x.status==="done"?"light":"secondary"}" data-action="status" data-id="${esc(x.id)}">${x.status==="done"?"改为待复习":"标记已掌握"}</button><button class="light" data-action="edit" data-id="${esc(x.id)}">编辑</button><button class="danger" data-action="delete" data-id="${esc(x.id)}">删除</button></div>
 <div class="details ${open?"":"hidden"}"><p><strong>中文意思：</strong>${esc(x.cn||"（尚未填写）")}</p><p><strong>用法提示：</strong>${esc(x.note||"（尚未填写）")}</p></div>
 </article>`}).join("");
}
document.getElementById("cards").addEventListener("click",e=>{
 const b=e.target.closest("button[data-action]");if(!b)return;
 const x=items.find(v=>v.id===b.dataset.id);if(!x)return;
 const action=b.dataset.action;
 if(action==="reveal"){revealed.has(x.id)?revealed.delete(x.id):revealed.add(x.id);render();}
 if(action==="status"){x.status=x.status==="done"?"todo":"done";persist();render();}
 if(action==="delete"){if(confirm("确定删除这条练习吗？")){items=items.filter(v=>v.id!==x.id);revealed.delete(x.id);persist();render();}}
 if(action==="edit"){
  const pattern=prompt("编辑句型 / 重点：",x.pattern);if(pattern===null)return;
  const jp=prompt("编辑日语例句：",x.jp);if(jp===null)return;
  const cn=prompt("编辑中文意思：",x.cn||"");if(cn===null)return;
  const note=prompt("编辑用法提示：",x.note||"");if(note===null)return;
  x.pattern=pattern.trim();x.jp=jp.trim();x.cn=cn.trim();x.note=note.trim();persist();render();
 }
});
document.getElementById("search").addEventListener("input",render);
document.getElementById("categoryFilter").addEventListener("change",render);
document.getElementById("statusFilter").addEventListener("change",render);
document.getElementById("showAllBtn").addEventListener("click",()=>{items.forEach(x=>revealed.add(x.id));render();});
document.getElementById("hideAllBtn").addEventListener("click",()=>{revealed.clear();render();});
document.getElementById("randomBtn").addEventListener("click",()=>{
 const pool=items.filter(x=>x.status!=="done");const pick=pool.length?pool[Math.floor(Math.random()*pool.length)]:items[Math.floor(Math.random()*items.length)];
 if(!pick){alert("还没有练习内容。");return;}
 document.getElementById("search").value="";document.getElementById("categoryFilter").value="";document.getElementById("statusFilter").value="";
 render();revealed.delete(pick.id);const el=document.getElementById("card-"+pick.id);if(el){el.scrollIntoView({behavior:"smooth",block:"center"});el.style.outline="3px solid #8bb6a0";setTimeout(()=>el.style.outline="",1600);}
});
document.getElementById("addForm").addEventListener("submit",e=>{
 e.preventDefault();const category=document.getElementById("newCategory").value==="自定义"?(prompt("请输入类别名称：")||"自定义"):document.getElementById("newCategory").value;
 const item={id:"u"+Date.now(),category,pattern:document.getElementById("newPattern").value.trim(),jp:document.getElementById("newJapanese").value.trim(),cn:document.getElementById("newChinese").value.trim(),note:document.getElementById("newNote").value.trim(),status:"todo"};
 if(!item.pattern||!item.jp){alert("请至少填写句型和日语例句。");return;}
 items.unshift(item);persist();e.target.reset();revealed.add(item.id);render();document.getElementById("cards").scrollIntoView({behavior:"smooth"});
});
document.getElementById("exportBtn").addEventListener("click",()=>{
 const blob=new Blob([JSON.stringify(items,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");
 a.href=url;a.download="japanese-review-backup.json";document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
});
document.getElementById("importBtn").addEventListener("click",()=>document.getElementById("importFile").click());
document.getElementById("importFile").addEventListener("change",async e=>{
 const file=e.target.files[0];if(!file)return;
 try{const data=JSON.parse(await file.text());if(!Array.isArray(data)||!data.every(x=>x&&x.jp&&x.pattern))throw new Error("格式不正确");if(confirm("导入会替换当前所有练习，确定继续吗？")){items=data.map((x,i)=>({...x,id:String(x.id||("imp"+Date.now()+i)),status:x.status==="done"?"done":"todo"}));revealed.clear();persist();render();alert("导入成功！");}}catch(err){alert("导入失败：文件格式不正确或文件已损坏。");}e.target.value="";
});
render();
</script>
</body>
</html>
