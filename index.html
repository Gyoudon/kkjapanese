<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>日语单词本</title>
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#1b2433;--sub:#5d6778;--line:#d5dbe3;--ac:#2f4b8f;--acbg:#e3e9f6;--ok:#2e7d5b;--okbg:#dff1e8;--star:#c98a0b;--bad:#b3402f}
@media(prefers-color-scheme:dark){:root{--bg:#141a26;--card:#1d2535;--ink:#e8ecf3;--sub:#9aa6ba;--line:#2e394d;--ac:#8fa8e6;--acbg:#26324d;--ok:#6cc59a;--okbg:#1f3a30;--star:#e4a93a;--bad:#e8806f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 -apple-system,"PingFang SC","Hiragino Sans","Microsoft YaHei",sans-serif}
.ja{font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP","Songti SC",serif}
main{max-width:760px;margin:0 auto;padding:16px 14px 80px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin:8px 0 14px}
h1{font-size:1.5rem;margin:0}
.stat{color:var(--sub);font-size:.9rem}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
nav{display:flex;gap:6px;margin-bottom:14px}
nav button{flex:1}
button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer}
button:hover{border-color:var(--ac)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button.on{background:var(--ac);border-color:var(--ac);color:var(--bg);font-weight:600}
button.go{background:var(--ac);border-color:var(--ac);color:var(--bg)}
button.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
button.no{border-color:var(--bad);color:var(--bad)}
input[type=search]{width:100%;font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chips button{padding:4px 12px;font-size:.9rem;border-radius:16px}
details.c{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
details.c[open]{border-color:var(--ac)}
summary{list-style:none;display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer}
summary::-webkit-details-marker{display:none}
.w{font-size:1.25rem;font-weight:600;min-width:0}
.rd{color:var(--sub);font-size:.85rem}
.m1{flex:1;min-width:0;color:var(--sub);font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ic{padding:2px 8px;font-size:1rem;line-height:1.4;border:0;background:none;color:var(--sub)}
.ic.on{background:none;color:var(--star)}
.ic.dn.on{color:var(--ok)}
.body{padding:2px 14px 14px;border-top:1px solid var(--line)}
.body h4{margin:12px 0 2px;font-size:.85rem;color:var(--sub);font-weight:600}
.body ul{margin:0;padding-left:20px}
.tags span{display:inline-block;background:var(--acbg);color:var(--ac);border-radius:12px;padding:1px 10px;margin:2px 4px 2px 0;font-size:.85rem}
.ex{margin:6px 0;padding-left:10px;border-left:3px solid var(--line)}
.ex .z{color:var(--sub);font-size:.9rem}
.ex .k{color:var(--sub);font-size:.85rem}
.note{background:var(--acbg);border-radius:6px;padding:6px 10px;font-size:.88rem;margin-top:10px}
.qz details{margin-top:4px}
.qz summary{padding:0;display:block;color:var(--ac);cursor:pointer}
.empty{text-align:center;color:var(--sub);padding:40px 0}
.fc{background:var(--card);border:1px solid var(--line);border-radius:14px;min-height:300px;padding:26px 20px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;cursor:pointer}
.fc .big{font-size:2.6rem;line-height:1.3;word-break:break-all}
.fc .hint{color:var(--sub);font-size:.85rem;margin-top:16px}
.fc .back{text-align:left;width:100%}
.fc .back .rdb{font-size:1.5rem;text-align:center}
.row{display:flex;gap:8px;margin-top:12px}
.row button{flex:1;padding:12px}
.pg{color:var(--sub);font-size:.9rem;text-align:center;margin:8px 0}
.qbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 18px}
.qbox .q{font-size:1.2rem;line-height:1.8}
.ans{margin-top:14px;padding:10px 12px;background:var(--okbg);border-radius:8px;color:var(--ok);font-weight:600}
.ld{color:var(--sub);text-align:center;padding:40px 0}
@media(prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<main>
<header><h1>日语单词本</h1><div class="stat" id="stat"></div></header>

<button data-t="list" class="on">词表</button>
<button data-t="fc">闪卡</button>
<button data-t="qz">测验</button>
</nav>

</main>

留了一点钱在手边当生活费。"}],"quiz":{"q":"大事な書類は、必ずコピーを（残して／残って）おきましょう。","a":"残して"}},{"id":18,"input":"みこし合わせ","type":"corrected","word":"見合わせ","reading":"みあわせ","kanji":"見合わせ","pos":"名词／下一段他动词（見合わせる）","meaning":["（原本要做的事）暂缓、暂停","互相对看（顔を見合わせる）"],"frequency":"中高","paraphrases":["控える","やめておく","延期する","様子を見る"],"mnemonic":"見+合わせる。运転見合わせ=暂停运行。别和見越し(预见)、神輿(みこし)混。","examples":[{"ja":"大雪のため、電車は運転を見合わせています。","zh":"因为大雪，电车暂停运行。","casual":"大雪で電車が止まっています。"},{"ja":"天気が悪いので、旅行は見合わせることにした。","zh":"天气不好，决定先不去旅行了。"}],"quiz":{"q":"台風が近づいているので、今日の外出は（見合わせる／見越す）ことにした。","a":"見合わせる"},"note":"原输入「みこし合わせ」不是词，推测为「見合わせ」。"},{"id":19,"input":"ハムエッグ","word":"ハムエッグ","reading":"ハムエッグ","kanji":"","pos":"名词（外来语）","meaning":["火腿煎蛋"],"frequency":"中等","paraphrases":["目玉焼き","ハム入りの目玉焼き","ベーコンエッグ"],"mnemonic":"ハム+エッグ，日语没有and。同类：ベーコンエッグ/スクランブルエッグ/目玉焼き/ゆで卵。","examples":[{"ja":"朝ごはんは、トーストとハムエッグが定番だ。","zh":"早餐经常是吐司加火腿煎蛋。","casual":"朝ごはんは、トーストと目玉焼きが多い。"},{"ja":"喫茶店のモーニングで、ハムエッグを注文した。","zh":"在咖啡店的早餐套餐里点了火腿煎蛋。"}],"quiz":{"q":"卵を割らずにかき混ぜて焼いたものは（目玉焼き／スクランブルエッグ）と言う。","a":"スクランブルエッグ"}},{"id":20,"input":"ハムカツ","word":"ハムカツ","reading":"ハムカツ","kanji":"","pos":"名词（外来语混合词）","meaning":["炸火腿排（火腿裹面包糠油炸）"],"frequency":"中等","paraphrases":["ハムのフライ","ハムの揚げ物","ハムを揚げたもの"],"mnemonic":"ハム+カツ(カツレツ)。カツ与「勝つ」同音，考前吃カツ丼讨彩头。同类：とんかつ/チキンカツ/メンチカツ。","examples":[{"ja":"居酒屋で、ハムカツとビールを注文した。","zh":"在居酒屋点了炸火腿排和啤酒。"},{"ja":"母が作るハムカツは、ソースをかけて食べるのが好きだ。","zh":"我喜欢把妈妈做的炸火腿排淋上酱汁吃。","casual":"お母さんが作るハムのフライには、ソースをかけたい。"}],"quiz":{"q":"試験の前に「勝つ」にかけて食べる、ご飯の上にとんかつをのせた料理は（カツ丼／親子丼）だ。","a":"カツ丼"}},{"id":21,"input":"精進","word":"精進","reading":"しょうじん","kanji":"精進","pos":"名词（サ变）","meaning":["专心致志地努力、刻苦钻研","佛教修行","戒荤吃素（精進料理）"],"frequency":"中等","paraphrases":["頑張る","努力する","励む","腕を磨く"],"mnemonic":"精+進，专一地前进。套话：今後も精進してまいります／日々精進／精進料理。","examples":[{"ja":"来年も、さらに精進してまいりますので、よろしくお願いいたします。","zh":"明年我也会更加努力，请多关照。","casual":"来年ももっと頑張りますので、よろしくお願いします。"},{"ja":"京都のお寺で、精進料理を食べた。","zh":"在京都的寺院里吃了素斋。"}],"quiz":{"q":"今後も一層（精進／精算）してまいります。","a":"精進"}},{"id":22,"input":"ところてん","word":"ところてん","rea ":"な形容词／名词","meaning":["非常畅快、大快人心（憋闷被一扫而空的爽）"],"frequency":"中等","paraphrases":["スカッとする","すっきりする","気持ちいい","爽快"],"mnemonic":"痛=非常、极其。痛快≠愉快(开心)≠爽快(清爽利落)。","examples":[{"ja":"弱いチームが強豪に勝つ姿は、見ていて痛快だった。","zh":"弱队击败强队的样子，看着特别过瘾。","casual":"弱いチームが強いチームに勝って、スカッとした。"},{"ja":"言いたかったことをはっきり言えて、痛快な気分だ。","zh":"把想说的话清楚地说了出来，心情很畅快。"}],"quiz":{"q":"嫌味な上司が謝る場面は、見ていて（痛快／愉快）だった。","a":"痛快"}},{"id":27,"input":"お金もうける","type":"corrected","word":"お金を儲ける","reading":"おかねもうける","kanji":"お金を儲ける","pos":"连语（儲ける=下一段他动词）","meaning":["赚钱、赚到利润（口语里常省略助词「を」）"],"frequency":"高","paraphrases":["稼ぐ","儲かる","お金になる","利益を出す"],"mnemonic":"儲ける(他)人赚到钱；儲かる(自)生意赚钱；儲け(名)利润。","examples":[{"ja":"株でお金を儲けようとしたが、うまくいかなかった。","zh":"想靠炒股赚钱，结果不顺利。","casual":"株で稼ごうとしたけど、うまくいかなかった。"},{"ja":"副業でお金もうけたいなら、まず小さく始めた方がいいよ。","zh":"如果想靠副业赚钱，最好先从小处做起。"}],"quiz":{"q":"あの店は毎日お客さんが並んでいて、かなり（儲かって／儲けて）いるようだ。","a":"儲かって"}},{"id":28,"input":"横のつながる","type":"corrected","word":"横のつながり","reading":"よこのつながり","kanji":"横のつながり","pos":"名词短语","meaning":["横向的联系，同级、同辈、同领域人之间的往来和人脉"],"frequency":"中高","paraphrases":["同僚との関係","部署をまたいだ交流","ネットワーク","横の連携"],"mnemonic":"の后面要接名词形「つながり」。对应：縦のつながり(上下级)。つながる(自)/つなげる(他)。","examples":[{"ja":"会社では、部署を超えた横のつながりが大切だ。","zh":"在公司里，跨部门的横向联系很重要。"},{"ja":"同じ仕事をしている人と横のつながりを作りたい。","zh":"我想和做同样工作的人建立横向联系。"}],"quiz":{"q":"この地域は、住民同士の横の（つながる／つながり）が強い。","a":"つながり"}},{"id":29,"input":"取り付き","word":"取り付き","reading":"とりつき","kanji":"取り付き／取っ付き","pos":"名词（动词：取り付く）","meaning":["抓住、缠上","初次接触的印象、上手难易（取っ付きにくい）","登山：岩壁起点","取り付く島もない=对方冷淡得无从搭话"],"frequency":"取り付き低；取っ付きにくい、取り付く島もない中等","paraphrases":["話しかけにくい","入りにくい","全然相手にされなかった"],"mnemonic":"取り付く島もない：漂流在海上找不到可靠岸的岛。区分：取り付け(安装)、取り憑く(附身)。","examples":[{"ja":"この本は難しそうで、取っ付きにくい。","zh":"这本书看起来很难，不太容易入门。"},{"ja":"頼みに行ったが、取り付く島もなく断られた。","zh":"去拜托了，结果被冷冰冰地一口回绝了。","casual":"頼みに行ったが、全然聞いてもらえなかった。"}],"quiz":{"q":"上司に相談しようとしたが、（取り付く島も／取り付けも）ない態度だった。","a":"取り付く島も"}},{"id":30,"input":"勘違い","word":"勘違い","reading":"かんちがい","kanji":"勘違い","pos":"名词（サ变）","meaning":["误会、搞错（自己凭印象想错了）"],"frequency":"高","paraphrases":["思い違い","間違える","誤解","早とちり"],"mnemonic":"勘(直觉)+違い。てっきり描述当时想法，勘違い是定性。勘違い(认知错)/誤解(对人事理解错)/間違い(一般错误)。","examples":[{"ja":"ごめん、日にちを勘違いしてた。","zh":"对不起，我把日期搞错了。","casual":"ごめん、日にちを間違えてた。"},{"ja":"私のこと、何か勘違いしてない？","zh":"你是不是对我有什么误会？"}],"quiz":{"q":"会議は明日だと思っていたが、今日だった。完全に（勘違い／勘定）だった。","a":"勘違い"}},{"id":31,"input":"香り","word":"香り","reading":"かおり","kanji":"香り","pos":"名词（动词：香る）","meaning":["香气、香味（令人愉快的气味）"],"frequency":"高","paraphrases":["いい匂い","匂い","風味","アロマ"],"mnemonic":"香り=好闻、优雅；匂い=中性，好坏皆可；臭い=难闻。","examples":[{"ja":"台所からカレーのいい香りがしてきた。","zh":"厨房里飘来了咖喱的香味。","casual":"台所からカレーのいい匂いがしてきた。"},{"ja":"このお茶は、香りがとてもよくて落ち着く。","zh":"这茶香味很好，让人觉得放松。"}],"quiz":{"q":"春になると、庭の花の（香り／臭い）が部屋まで届く。","a":"香り"}},{"id":32,"input":"香りがして","word":"香りがして","reading":"かおりがして","kanji":"香りがして","pos":"连语（香りがする的て形）","meaning":["散发出香味、闻到香味，后接其他句子"],"frequency":"高","paraphrases":["いい匂いがして","香ってきて","匂いが漂ってきて"],"mnemonic":"〜がする=感官表达：音がする/味がする/気がする。助词用「が」，不用「を」。","examples":[{"ja":"部屋に入ると、ほんのり花の香りがして、気持ちが落ち着いた。","zh":"一进房间就有淡淡的花香，心情安定下来了。"},{"ja":"パン屋の前を通ったら、いい香りがして、思わず中に入ってしまった。","zh":"经过面包店门口时闻到好香，忍不住走了进去。"}],"quiz":{"q":"窓を開けたら、金木犀の香り（が／を）して、秋を感じた。","a":"が"}},{"id":33,"input":"ていけばいい","type":"phrase","word":"〜ていけばいい","reading":"ていけばいい","kanji":"","pos":"句型","meaning":["只要…下去就好、慢慢…就行（安慰、建议）","傘を持っていけばいい=带去就行"],"frequency":"高","paraphrases":["〜続ければいい","〜ていこう","〜でいいよ"],"mnemonic":"〜ていく(向未来持续)+〜ばいい。少しずつ〜ていけばいい。别和「行けばいい」混。","examples":[{"ja":"最初はできなくても、少しずつ慣れていけばいいよ。","zh":"一开始不会也没关系，慢慢习惯就好。","casual":"最初はできなくても、ゆっくり慣れればいいよ。"},{"ja":"日本語の単語は、毎日少しずつ覚えていけばいい。","zh":"日语单词每天慢慢记就行。"}],"quiz":{"q":"焦らなくても、少しずつ覚えて（いけ／いく）ばいい。","a":"いけ"}},{"id":34,"input":"全身もみほぐし","word":"全身もみほぐし","reading":"ぜんしんもみほぐし","kanji":"全身揉みほぐし","pos":"名词（动词：揉みほぐす）","meaning":["全身按摩放松，把紧绷僵硬的肌肉揉开"],"frequency":"中等","paraphrases":["マッサージ","全身マッサージ","体をほぐしてもらう","リラクゼーション"],"mnemonic":"揉む(もむ)与もめる同一汉字。ほぐす(他)/ほぐれる(自)。もみほぐし只放松肌肉，不同于整体(调整骨骼)。","examples":[{"ja":"仕事で疲れたので、全身もみほぐしに行ってきた。","zh":"工作累了，去做了全身按摩。","casual":"仕事で疲れたから、マッサージに行ってきた。"},{"ja":"肩の凝りをもみほぐしてもらって、体が軽くなった。","zh":"肩膀的酸痛被揉开后，身体轻松多了。"}],"quiz":{"q":"温かいお茶を飲んだら、緊張が（ほぐれて／ほぐして）きた。","a":"ほぐれて"}},{"id":35,"input":"いざ","word":"いざ","reading":"いざ","kanji":"","pos":"副词／感叹词","meaning":["到了真正要做的时候、事到临头（いざという時、いざとなると）","真正动手做时才发现…（いざ〜してみると）","古语腔号召：来吧！"],"frequency":"中高","paraphrases":["万が一の時","本番になると","実際にやってみると","さあ、出発！"],"mnemonic":"事前想得容易，真到那一步才有变化。整句背：いざという時／いざとなると／いざ〜てみると。","examples":[{"ja":"いざという時のために、少しお金を貯めておこう。","zh":"为了万一的时候，先存一点钱吧。","casual":"何かあった時のために、少しお金を貯めておこう。"},{"ja":"準備は完璧だったのに、いざ本番になると緊張して頭が真っ白になった。","zh":"明明准备得很充分，真到正式上场却紧张得脑子一片空白。"}],"quiz":{"q":"旅行の計画は楽しかったが、（いざ／てっきり）出発する日になると不安になってきた。","a":"いざ"}},{"id":36,"input":"問い詰め","word":"問い詰める","reading":"といつめる","kanji":"問い詰める","pos":"下一段他动词","meaning":["追问到底、逼问、盘问（咄咄逼人）"],"frequency":"中等","paraphrases":["追及する","しつこく聞く","詰め寄る","問いただす"],"mnemonic":"問い+詰める=用问题把人逼到墙角。〜詰める家族：追い詰める/思い詰める/煮詰める。常用被动：問い詰められる。","examples":[{"ja":"帰りが遅い理由を、母に問い詰められた。","zh":"我被妈妈追问为什么这么晚回家。","casual":"帰りが遅い理由を、お母さんにしつこく聞かれた。"},{"ja":"記者は大臣を問い詰めたが、明確な答えは得られなかった。","zh":"记者追问了大臣，但没有得到明确的答复。"}],"quiz":{"q":"隠し事がばれて、彼女に朝まで（問い詰め／問い詰めて）られた。","a":"問い詰め"}},{"id":37,"input":"目を通して","word":"目を通す","reading":"めをとおす","kanji":"目を通す","pos":"连语（五段他动词）","meaning":["从头到尾大致看一遍、过目、浏览（掌握大意）"],"frequency":"高","paraphrases":["ざっと読む","見ておく","チェックする","確認する"],"mnemonic":"目+通す=让视线扫过。助词用「に」：資料に目を通す。敬语：お目通しください。目を通す<読み込む<精読。","examples":[{"ja":"会議の前に、この資料に目を通しておいてください。","zh":"开会之前，请先看一下这份资料。","casual":"会議の前に、この資料をざっと読んでおいてね。"},{"ja":"契約書には必ず目を通してからサインしてください。","zh":"合同一定要先看过再签字。"}],"quiz":{"q":"出かける前に、メール（に／を）目を通した。","a":"に"}},{"id":38,"input":"ちょくちょく","word":"ちょくちょく","reading":"ちょくちょく","kanji":"","pos":"副词","meaning":["时常、三天两头、隔三差五（轻松口语）"],"frequency":"高","paraphrases":["よく","しょっちゅう","たびたび","頻繁に"],"mnemonic":"频率排序：しょっちゅう＞ちょくちょく＞よく＞時々＞たまに。和ちょっと(稍微)别混。","examples":[{"ja":"この店には、仕事帰りにちょくちょく寄っている。","zh":"下班回家路上，我常常顺便来这家店。","casual":"この店には、仕事帰りによく寄っている。"},{"ja":"最近、友達からちょくちょく連絡が来る。","zh":"最近朋友时不时就来联系我。"}],"quiz":{"q":"ちょくちょく／たまに／しょっちゅう のうち頻度が最も高いのは？","a":"しょっちゅう"}},{"id":39,"input":"蓋を開け","word":"蓋を開ける","reading":"ふたをあける","kanji":"蓋を開ける","pos":"连语（開ける=下一段他动词）","meaning":["打开盖子","蓋を開けてみれば〜：真正揭晓、实际一看才发现（与预想不同）"],"frequency":"字面高，比喻中高","paraphrases":["実際にやってみたら","結果を見たら","終わってみれば"],"mnemonic":"盖着盖子的锅，不打开不知道结果。同音别混：開ける/空ける/明ける。","examples":[{"ja":"蓋を開けてみれば、予想以上の大ヒットだった。","zh":"结果一揭晓，竟是大获成功，超出预期。","casual":"やってみたら、思ったよりずっと売れた。"},{"ja":"不安だったけど、蓋を開けてみれば、意外とあっさり終わった。","zh":"本来很担心，真做起来却出乎意料地很快就完了。"}],"quiz":{"q":"鍋の蓋（を／に）開けたら、おいしそうな匂いがした。","a":"を"}},{"id":40,"input":"見掛け","word":"見かけ","reading":"みかけ","kanji":"見掛け","pos":"名词；动词形：見かける（下一段他动词）","meaning":["外表、外观（見かけによらず＝人不可貌相、見かけ倒し）","見かける：偶然看到、常看到"],"frequency":"高","paraphrases":["見た目","外見","パッと見","目にする"],"mnemonic":"見+掛け：挂在表面让人看到的东西；視線碰巧挂到=偶然看到。見かけ/見た目(最口语)/外見(书面)。","examples":[{"ja":"彼は見かけによらず、とても優しい人だ。","zh":"他人不可貌相，其实是个非常温柔的人。","casual":"彼は見た目と違って、すごく優しい人だ。"},{"ja":"この辺りでは、最近外国人の観光客をよく見かける。","zh":"这一带最近常常能看到外国游客。","casual":"この辺りでは、最近外国人の観光客をよく目にする。"}],"quiz":{"q":"あの人は怖そうだが、（見かけ／見かける）によらず親切だ。","a":"見かけ"}},{"id":41,"input":"するわけない","word":"〜わけない","reading":"するわけない","kanji":"","pos":"句型","meaning":["怎么可能做、不可能（强烈否定）","单独说「わけない」=容易、轻而易举"],"frequency":"高","paraphrases":["するはずがない","ありえない","絶対しない","するもんか"],"mnemonic":"わけ(道理)+ない。わけがない(不可能)/わけにはいかない(因情况不能)/わけではない(并不是)。","examples":[{"ja":"あんなに優しい人が、そんなひどいことをするわけない。","zh":"那么温柔的人，怎么可能做出那么过分的事。","casual":"あんなに優しい人が、そんなことするはずないよ。"},{"ja":"一度も練習していないのに、本番で上手にできるわけないでしょ。","zh":"一次都没练习过，正式上场怎么可能做得好。"}],"quiz":{"q":"あの人が約束を忘れる（わけない／わけにはいかない）よ。","a":"わけない"}},{"id":42,"input":"いやらしい","word":"いやらしい","reading":"いやらしい","kanji":"嫌らしい／厭らしい","pos":"い形容词","meaning":["令人不舒服、让人反感（心机、小气、做作）","下流、猥琐、带色情意味"],"frequency":"中等","paraphrases":["感じ悪い","嫌味な","せこい","エッチな","気持ち悪い"],"mnemonic":"嫌+らしい=一副让人讨厌的样子。いやらしい言い方/目つき/笑い方。杀伤力强，多用于第三者。","examples":[{"ja":"人の失敗を笑うなんて、いやらしい性格だ。","zh":"嘲笑别人的失败，性格真让人不舒服。","casual":"人の失敗を笑うなんて、感じ悪いね。"},{"ja":"彼の言い方は、いつもどこかいやらしい。","zh":"他说话的方式总是有点让人不舒服。"}],"quiz":{"q":"「いやらしい言い方」はどの意味に近い？（感じ悪い言い方／楽しい言い方）","a":"感じ悪い言い方"}},{"id":43,"in (标题)。","examples":[{"ja":"彼は失敗の中にも、学ぶ価値を見いだした。","zh":"他在失败中也发现了值得学习的价值。","casual":"彼は失敗の中にも、学べることを見つけた。"},{"ja":"監督が若い選手の才能を見いだして、チームに入れた。","zh":"教练发现了年轻选手的才能，把他招进了队伍。"}],"quiz":{"q":"忙しい毎日の中にも、小さな喜びを（見いだす／見つかる）ことができる。","a":"見いだす"}},{"id":68,"input":"深煎り","word":"深煎り","reading":"ふかいり","kanji":"深煎り","pos":"名词","meaning":["深度烘焙（咖啡豆、芝麻、茶叶），味道偏苦、香浓、酸味少"],"frequency":"中等","paraphrases":["苦味の強いコーヒー","しっかり焙煎した豆","ダークロースト"],"mnemonic":"浅煎り(酸味明显)→中煎り(平衡)→深煎り(苦味重)。煎る(不加油干焙)vs 炒める(用油)。","examples":[{"ja":"私はミルクを入れるので、深煎りのコーヒーが好きだ。","zh":"我会加牛奶，所以喜欢深烘焙的咖啡。","casual":"私はミルクを入れるので、苦味の強いコーヒーが好きだ。"},{"ja":"このお店では、豆を深煎りか浅煎りか選べる。","zh":"这家店可以选择咖啡豆是深烘焙还是浅烘焙。"}],"quiz":{"q":"酸味が少なくて、苦味がしっかりしたコーヒー豆は（深煎り／浅煎り）だ。","a":"深煎り"}},{"id":69,"input":"被写体","word":"被写体","reading":"ひしゃたい","kanji":"被写体","pos":"名词","meaning":["拍摄对象（照片、视频、绘画里被拍的人或物）"],"frequency":"中等","paraphrases":["モデル","撮りたいもの","写っている人／もの","対象"],"mnemonic":"被(被动)+写す+体。同族：被害/被告。撮影者↔被写体。被写体深度=景深。","examples":[{"ja":"彼女はいつも笑顔で、写真を撮りたくなる被写体だ。","zh":"她总是笑容满面，是让人很想拍的对象。","casual":"彼女はいつも笑顔で、写真を撮りたくなるモデルだ。"},{"ja":"動物は動くので、被写体にピントを合わせるのが難しい。","zh":"动物会动，所以很难对准焦。"}],"quiz":{"q":"カメラで撮影されるときの人や物を（被写体／撮影者）という。","a":"被写体"}},{"id":70,"input":"誰に売らないか","type":"phrase","word":"誰に売らないか","reading":"だれにうらないか","kanji":"","pos":"从句（间接疑问）","meaning":["不卖给谁、该拒绝把东西卖给哪些人（商业策略、选客户）"],"frequency":"中等（商业场合）","paraphrases":["誰には売らないか","売らない相手は誰か","断る客は誰か"],"mnemonic":"与「誰に売るか」成对。〜か嵌入句后常接を/が：誰に売らないかを決める。更自然：誰には売らないか。","examples":[{"ja":"誰に売るかより、誰に売らないかを決める方が難しい。","zh":"比起决定卖给谁，决定不卖给谁更难。"},{"ja":"質の悪い客に売らないという判断も、ビジネスでは大切だ。","zh":"不把东西卖给品质差的客人，这种判断在生意里也很重要。","casual":"面倒な客には売らないと決めるのも、商売では大事だ。"}],"quiz":{"q":"誰に売る（か／を）より、誰に売らないかを決める方が大切だ。","a":"か"},"note":"句子没有语法错误，但是从句，不是完整句。"},{"id":71,"input":"ブランケット","word":"ブランケット","reading":"ブランケット","kanji":"","pos":"名词（外来语 blanket）","meaning":["毯子，尤指轻便、随手盖的小毯"],"frequency":"高","paraphrases":["毛布","膝掛け","タオルケット","掛け布団"],"mnemonic":"-et→ット，同ジャケット/チケット/ポケット。厚→薄：布団>毛布>ブランケット>タオルケット。","examples":[{"ja":"冷房が効いているので、ブランケットを膝にかけた。","zh":"空调开得很足，所以我把毯子盖在了腿上。","casual":"冷房が効いているので、膝掛けを使った。"},{"ja":"このカフェは、寒い人にブランケットを貸してくれる。","zh":"这家咖啡店会把毯子借给怕冷的客人。"}],"quiz":{"q":"オフィスで足が冷えるので、（ブランケット／ジャケット）を膝にかけた。","a":"ブランケット"}},{"id":72,"input":"口にされる","word":"口にする（被动／尊敬形）","reading":"くちにされる","kanji":"口にされる","pos":"连语（口にする的被动形／尊敬形）","meaning":["被说出口、被提起","尊敬语：（上级、对方）说了、提到了","被吃、被喝（少用）"],"frequency":"中等","paraphrases":["言われる","話題にされる","持ち出される","おっしゃる"],"mnemonic":"口にする：食べ物を口にする(吃，常用否定)/言葉を口にする(说出口)。軽々しく口にする/口にできない。","examples":[{"ja":"触れてほしくない話題を、人前で口にされて困った。","zh":"不想被提起的话题，被人在大家面前说出来，很尴尬。","casual":"触れてほしくない話を、みんなの前で言われて困った。"},{"ja":"社長が口にされた言葉が、今も心に残っている。","zh":"社长说过的话，到现在还留在心里。","casual":"社長がおっしゃった言葉が、今も心に残っている。"}],"quiz":{"q":"自分の失敗を、人前で（口にして／口にされて）嫌な気持ちになった。","a":"口にされて"}},{"id":73,"input":"耳に澄ます","type":"corrected","word":"耳を澄ます","reading":"みみをすます","kanji":"耳を澄ます","pos":"连语（澄ます=五段他动词）","meaning":["侧耳倾听、凝神细听"],"frequency":"中高（偏文学）","paraphrases":["耳をすませる","よく聞く","聞き耳を立てる","耳をそばだてる"],"mnemonic":"助词固定用「を」：耳を澄ます。听的对象用「に」：風の音に耳を澄ます。耳を澄ます/聞き耳を立てる(偷听)/耳を傾ける(听取意见)。","examples":[{"ja":"静かな夜、耳を澄ますと、遠くから虫の声が聞こえた。","zh":"安静的夜里，侧耳细听，能听到远处的虫鸣声。","casual":"静かな夜、よく聞くと、遠くで虫が鳴いていた。"},{"ja":"波の音に耳を澄ませて、しばらく海を眺めていた。","zh":"侧耳倾听海浪声，望着大海看了好一会儿。"}],"quiz":{"q":"目を閉じて、風の音（に／を）耳を澄ます。","a":"に"},"note":"原输入「耳に澄ます」助词有误，应为「耳を澄ます」。"},{"id":74,"input":"なくせない","word":"なくせない","reading":"なくせない","kanji":"無くす／失くす","pos":"动词（なくす的可能形否定，五段）","meaning":["消除不掉、去不掉（习惯、不安、差距）","舍不掉、放弃不了"],"frequency":"中高","paraphrases":["取り除けない","なくならない","消せない","やめられない"],"mnemonic":"なくす(他，人弄没)↔なくなる(自，自己消失)。なくせない(我没能力去掉)/なくならない(它不会自己消失)。","examples":[{"ja":"注意しているのに、うっかりミスをなくせない。","zh":"明明很小心，却还是消除不了粗心的错误。","casual":"気をつけているのに、うっかりミスがなくならない。"},{"ja":"夜中にお菓子を食べる習慣が、なかなかなくせない。","zh":"半夜吃零食的习惯，怎么也改不掉。","casual":"夜中にお菓子を食べる習慣が、なかなかやめられない。"}],"quiz":{"q":"爪を噛む癖を、どうしても（なくせない／なくならない）。","a":"なくせない"}},{"id":75,"input":"反動","word":"反動","reading":"はんどう","kanji":"反動","pos":"名词","meaning":["反弹、物极必反（做过头后出现相反的结果）","物理：反作用、后坐力","政治：反动、逆潮流"],"frequency":"中高","paraphrases":["リバウンド","揺り戻し","〜の裏返し"],"mnemonic":"整句背：〜の反動で。反動(反方向的结果)/反発(抵触)/反作用(物理)/反応(回应)。","examples":[{"ja":"休みなく働いた反動で、休日は一日中寝ていた。","zh":"因为之前连轴转，休息日睡了一整天。","casual":"ずっと忙しかった分、休みの日は一日中寝ていた。"},{"ja":"銃を撃つと、強い反動で腕が後ろに跳ね上がる。","zh":"开枪时，强大的后坐力会让手臂向后弹起。"}],"quiz":{"q":"厳しい食事制限の（反動／反応）で、ついたくさん食べてしまった。","a":"反動"}},{"id":76,"input":"もはや","word":"もはや","reading":"もはや","kanji":"最早","pos":"副词","meaning":["事到如今、已经…了（再也…），带无可挽回的语气"],"frequency":"中等（偏书面）","paraphrases":["もう","今さら","すでに","とっくに"],"mnemonic":"最早是借字，直接记读音和用法。整句：もはや〜ない。もはや手遅れだ/限界/誰も〜ない。","examples":[{"ja":"計画が白紙になった今、もはや後戻りはできない。","zh":"计划已经泡汤的现在，再也没法回头了。","casual":"計画がダメになった今、もう戻れない。"},{"ja":"彼の言い訳は、もはや誰も信じていない。","zh":"他的借口，现在已经没有人相信了。"}],"quiz":{"q":"ここまで来たら、（もはや／これから）後戻りはできない。","a":"もはや"}},{"id":77,"input":"誇る","word":"誇る","reading":"ほこる","kanji":"誇る","pos":"五段他动词","meaning":["引以为豪","夸耀、炫耀（略带贬义）","拥有令人骄傲的规模、实力（世界一を誇る）"],"frequency":"中高","paraphrases":["自慢する","誇りに思う","胸を張る","〜を売りにする"],"mnemonic":"名词：誇り(ほこり，自豪)，与埃(ほこり，灰尘)同音。誇る(庄重)/自慢(显摆)/威張る(摆架子)。誇れる/誇らしい。","examples":[{"ja":"この町は、400年の歴史を誇る温泉地だ。","zh":"这个城镇是拥有400年历史的温泉胜地。","casual":"この町は、400年も続く有名な温泉地だ。"},{"ja":"自分の仕事を誇りに思っている。","zh":"我为自己的工作感到自豪。"}],"quiz":{"q":"日本が世界に（誇る／威張る）技術は、多くの国で使われている。","a":"誇る"}},{"id":78,"input":"投げかける","word":"投げかける","reading":"なげかける","kanji":"投げ掛ける","pos":"下一段他动词","meaning":["抛向、投向","投以（视线、笑容、话语）","抛出（问题、疑问、话题），引发思考","投下（影子、光）"],"frequency":"中高","paraphrases":["問いかける","質問する","話を振る","視線を向ける"],"mnemonic":"投げる+かける(朝对方发出)。〜かける家族：話しかける/呼びかける/問いかける/訴えかける。問いかける(问某人)vs 投げかける(朝大家抛出让人思考)。","examples":[{"ja":"この映画は、観る人に「幸せとは何か」という問いを投げかけている。","zh":"这部电影向观众抛出了「幸福是什么」这个问题。","casual":"この映画は、観る人に「幸せって何だろう」と考えさせる。"},{"ja":"彼女は、振り向きざまに優しい笑顔を投げかけた。","zh":"她回头的瞬间，朝他投去温柔的微笑。"}],"quiz":{"q":"社会に（投げかける／投げ出す）疑問を、記事にまとめた。","a":"投げかける"}},{"id":79,"input":"はっと","word":"はっと","reading":"はっと","kanji":"","pos":"副词（拟态词，常用：はっとする）","meaning":["突然意识到、猛地一惊（察觉、想起，多半是不好的事）"],"frequency":"高","paraphrases":["ふと","急に気づく","ドキッとする","びっくりする"],"mnemonic":"はっと(一惊，心里一紧)↔ほっと(松一口气)。はっと我に返る/息をのむ/目が覚める。","examples":[{"ja":"電車を降りたあと、傘を忘れたことにはっと気づいた。","zh":"下了电车后，猛然想起忘了拿伞。","casual":"電車を降りてから、「あ、傘忘れた！」と気づいた。"},{"ja":"子どもの言葉に、はっとさせられた。","zh":"孩子的一句话让我猛然醒悟。","casual":"子どもの言葉に、ドキッとした。"}],"quiz":{"q":"テストの結果を見て（はっと／ほっと）した。合格していて、心配がなくなったからだ。","a":"ほっと"}},{"id":80,"input":"省みる","word":"省みる","reading":"かえりみる","kanji":"省みる／顧みる","pos":"上一段他动词","meaning":["反省自己","回顾、回头看（多写顧みる）","顾及、关心（多用否定：顧みない）"],"frequency":"中低（偏书面）","paraphrases":["反省する","振り返る","見直す","気にかける"],"mnemonic":"省みる(向内，反省)/顧みる(向后/向外，回顾、顾及)。省く(はぶく)；反省/帰省读せい。自らを省みる/家庭を顧みない/危険を顧みず。","examples":[{"ja":"失敗したときは、人のせいにせず、まず自分を省みることが大切だ。","zh":"失败的时候，不要怪别人，先反省自己很重要。","casual":"失敗したときは、人のせいにしないで、まず自分を振り返ることが大事だ。"},{"ja":"彼は仕事に夢中で、家族を顧みなかった。","zh":"他沉迷于工作，没有顾及家人。","casual":"彼は仕事ばかりで、家族のことを気にかけなかった。"}],"quiz":{"q":"自分の言動を（省みる／省略する）ことで、同じ失敗を減らせる。","a":"省みる"}},{"id":81,"input":"自ずと","word":"自ずと","reading":"おのずと","kanji":"自ずと","pos":"副词","meaning":["自然而然地（不用刻意，条件齐了结果自己出现）"],"frequency":"中等（偏书面）","paraphrases":["自然と","自然に","おのずから","そのうち"],"mnemonic":"自ずと(自然而然)vs 自ら(みずから，亲自)。整句：〜すれば、自ずと〜。自ずと分かる/見えてくる/答えが出る。","examples":[{"ja":"毎日続けていれば、自ずと上達していくものだ。","zh":"每天坚持下去，自然就会进步。","casual":"毎日続けていれば、自然とうまくなるものだよ。"},{"ja":"焦らなくても、時が来れば自ずと答えは見えてくる。","zh":"即使不着急，时机到了，答案自然会浮现。"}],"quiz":{"q":"経験を積めば、仕事のコツは（自ずと／無理に）身につくものだ。","a":"自ずと"}},{"id":82,"input":"余計に","word":"余計に","reading":"よけいに","kanji":"余計に","pos":"副词（余計：な形容词／名词）","meaning":["更加、越发（本来就…现在更…）","多出来、额外多（余計に払う）","余計な＝多余的（余計なお世話）"],"frequency":"高","paraphrases":["もっと","なおさら","いっそう／さらに","多めに"],"mnemonic":"余(多出来的)+計(算出的量)。余計なお世話/余計な一言。余計に(本来就…更…)/もっと(中性)/かえって(反而)。","examples":[{"ja":"止められると、余計にやりたくなってしまう。","zh":"越是被阻止，就越想去做。","casual":"止められると、もっとやりたくなっちゃう。"},{"ja":"間違えて、料金を余計に払ってしまった。","zh":"弄错了，多付了费用。","casual":"間違えて、多めに払っちゃった。"}],"quiz":{"q":"「宿題をしなさい」と言われると、（余計に／あまり）やる気がなくなる。","a":"余計に"}},{"id":83,"input":"言い間違い","word":"言い間違い","reading":"いいまちがい","kanji":"言い間違い","pos":"名词（动词：言い間違える，下一段他动词）","meaning":["说错话、口误（无心之失）"],"frequency":"高","paraphrases":["言い違い","噛んだ","失言","口が滑った"],"mnemonic":"〜間違い家族：言い/聞き/読み/書き/見間違い、思い違い。言い間違い(无心口误)/口が滑る(说漏嘴)/失言(说了不恰当的话)。","examples":[{"ja":"先生を「お母さん」と呼んでしまう言い間違いは、よくあることだ。","zh":"把老师叫成「妈妈」这种口误，是常有的事。","casual":"先生を「お母さん」って呼んじゃうことは、よくあるよね。"},{"ja":"今のは言い間違いです。正しくは三十日です。","zh":"刚才是口误，正确的是三十号。"}],"quiz":{"q":"会議で名前を（言い間違い／聞き間違い）てしまい、恥ずかしかった。","a":"言い間違え（言い間違えてしまい）"},"note":"该题当时的选项给的是名词形，不准确；正确是动词连用形「言い間違え」。"},{"id":84,"input":"あるまい","word":"あるまい","reading":"あるまい","kanji":"有るまい","pos":"连语（ある+否定推量助动词まい）","meaning":["不会有吧、不至于有吧（ないだろう）","〜ではあるまいし：又不是…（所以别…）"],"frequency":"低（书面、古风）","paraphrases":["ないだろう","あるはずがない","あるわけない","〜じゃないんだから"],"mnemonic":"まい≈ない+う。食べよう↔食べまい。否定推量(そんなことはあるまい)/否定意志(二度と行くまい)。","examples":[{"ja":"彼が約束を忘れることは、よもやあるまい。","zh":"他应该不会忘记约定吧。","casual":"彼が約束を忘れることは、まずないだろう。"},{"ja":"子どもではあるまいし、いつまでも甘えていてはいけない。","zh":"你又不是小孩子，不能一直撒娇。","casual":"子どもじゃないんだから、いつまでも甘えちゃだめだよ。"}],"quiz":{"q":"子ども（ではあるまいし／ではないまい）、一人で行きなさい。","a":"ではあるまいし"}},{"id":85,"input":"話そうとすればするほど","type":"phrase","word":"〜（よ）うとすればするほど","reading":"はなそうとすればするほど","kanji":"","pos":"句型","meaning":["越是想说话，就越…；越努力想做某事，结果反而越做不好"],"frequency":"高","paraphrases":["話そうとすると、かえって〜","話そうとすると、余計に〜","焦れば焦るほど〜"],"mnemonic":"公式：V(よ)うとすればするほど。对比：練習すればするほど上手になる(顺向)/忘れようとすればするほど思い出す(反向)。后接かえって/余計に/逆に/ますます。","examples":[{"ja":"英語を話そうとすればするほど、緊張して言葉が出てこなくなる。","zh":"越是想说英语，就越紧张，话说不出来。","casual":"英語を話そうとすると、緊張してかえって言葉が出てこない。"},{"ja":"忘れようとすればするほど、彼のことを思い出してしまう。","zh":"越想忘记，就越是想起他。"}],"quiz":{"q":"早く寝よう（とすれば／とすると）するほど、目が冴えてしまう。","a":"とすれば"},"note":"原句语法正确，是不完整的句子（后面要接结果）。"},{"id":86,"input":"例外的な能力","word":"例外的な能力","reading":"れいがいてきなのうりょく","kanji":"例外的な能力","pos":"名词短语（例外的=な形容词）","meaning":["不在常规范围内的能力，即超出常人的能力","例外的に＝作为例外、破例"],"frequency":"例外的に常用，例外的な能力不常见","paraphrases":["並外れた能力","ずば抜けた能力","特別な能力","類まれな能力"],"mnemonic":"〜的=把名词变成な形容词。例外なく/例外を認める/例外的な措置。夸能力更自然：並外れた。","examples":[{"ja":"彼は記憶力において、並外れた能力を持っている。","zh":"他在记忆力方面有超出常人的能力。","casual":"彼は記憶力がずば抜けている。"},{"ja":"今回は例外的に、期限を一週間延ばします。","zh":"这次破例，把期限延长一周。","casual":"今回だけ特別に、期限を一週間延ばします。"}],"quiz":{"q":"規則では禁止だが、今回は（ ン","kanji":"","pos":"名词（外来语 dictation，可サ变）","meaning":["听写（边听边把听到的原文写下来）","口述记录、语音转文字"],"frequency":"中等","paraphrases":["書き取り","聞いて書く","口述筆記","音声入力","文字起こし"],"mnemonic":"dictate(口述)，与ディクテーター(独裁者)同源。ディクテーション(听写)/シャドーイング(跟读)/音読/暗唱。書き取り(日本学校里多是听读音写汉字)/聞き取り(听力理解)。","examples":[{"ja":"英語の聞き取り力を伸ばすために、毎日ディクテーションをしている。","zh":"为了提高英语听力，我每天都做听写。","casual":"英語の聞き取り力を伸ばすために、毎日聞いて書く練習をしている。"},{"ja":"会議の内容は、ディクテーション機能を使って文字にした。","zh":"会议的内容，用语音转文字功能整理成了文字。","casual":"会議の内容は、音声入力で文字にした。"}],"quiz":{"q":"音声を聞いて、聞こえたとおりに英文を書く練習を（ディクテーション／シャドーイング）という。","a":"ディクテーション"}},{"id":114,"input":"アクセス","word":"アクセス","reading":"アクセス","kanji":"","pos":"名词（外来语 access，可サ变）","meaning":["交通方式、到达的方便程度（アクセスがいい）","访问（网站、系统）","访问量","使用权限、接触数据"],"frequency":"高","paraphrases":["行き方","交通の便","行きやすさ","見る／開く"],"mnemonic":"整句背：アクセスがいい／悪い。アクセスマップ/アクセス方法/アクセスが集中する/アクセス数/アクセス権/不正アクセス。访问网站用アクセス，登录用ログイン。","examples":[{"ja":"このホテルは、駅から歩いて三分でアクセスがいい。","zh":"这家酒店离车站走路三分钟，交通很方便。","casual":"このホテルは、駅から歩いて三分で行きやすい。"},{"ja":"発売直後にアクセスが集中して、サイトが開けなくなった。","zh":"刚开售就涌入大量访问，网站打不开了。","casual":"売り出した直後に、見る人が増えすぎて、サイトが開けなくなった。"}],"quiz":{"q":"駅から近くて、買い物にも便利な場所なので、（アクセス／キャンセル）がいい。","a":"アクセス"}},{"id":115,"input":"感じる","word":"感じる","reading":"かんじる","kanji":"感じる","pos":"上一段他动词（也有自动词用法）","meaning":["感觉到（寒さ、痛み）","感到（情绪、想法）","从言行中体会到（誠意を感じる）"],"frequency":"高","paraphrases":["気がする","思う","〜に見える／〜そうだ","印象を受ける"],"mnemonic":"〜じる动词：信じる/感じる/命じる/混じる。感じる(体感、直觉)vs 思う(思考、判断)；感じ取る(察觉出来)。","examples":[{"ja":"最近、日本語が少しずつ上達していると感じる。","zh":"最近感觉日语在一点点进步。","casual":"最近、日本語がちょっと上手になってきた気がする。"}],"quiz":null,"note":"「感じる」「感じ」一起发来，小测验放在下一条「感じ」。"},{"id":116,"input":"感じ","word":"感じ","reading":"かんじ","kanji":"感じ","pos":"名词（感じる的连用形转成名词）","meaning":["感觉、印象（いい感じ、感じが悪い）","样子、氛围（〜な感じ）","口语缓和语气：〜って感じ"],"frequency":"非常高","paraphrases":["印象","雰囲気","様子","〜みたいな／〜っぽい"],"mnemonic":"感じがする/感じがいい／悪い/いい感じ/どんな感じ？/〜って感じ。感じ(整体印象)vs 感覚(身体感官)。","examples":[{"ja":"あの店員さんは、感じがいい。","zh":"那位店员给人的印象很好。","casual":"あの店員さんは、いい人だ。"},{"ja":"昨日の試合は、どんな感じだった？","zh":"昨天的比赛怎么样？"}],"quiz":{"q": ー是程序用的凭证。","examples":[{"ja":"新しいアプリを使うために、メールアドレスでアカウントを作った。","zh":"为了使用新的App，用邮箱注册了账号。","casual":"新しいアプリを使うために、メールアドレスで登録した。"},{"ja":"アカウントが乗っ取られたので、すぐにパスワードを変更した。","zh":"账号被盗了，所以马上改了密码。"}],"quiz":{"q":"SNSを始めるには、まず（アカウント／アクセント）を作る必要がある。","a":"アカウント"}},{"id":125,"input":"取り下げ","word":"取り下げ","reading":"とりさげ","kanji":"取り下げ","pos":"名词（动词：取り下げる，下一段他动词）","meaning":["撤回（已提出的申请、诉讼、提案、请求）","撤下、收走（餐具、商品、广告）"],"frequency":"中等（偏书面）","paraphrases":["取り消す","やめる","撤回する","引っ込める","キャンセルする"],"mnemonic":"取る+下げる。取り下げ(自己提出的东西主动收回)/取り消し(作废，也可由官方)/撤回(自己说过的话、决定当作没有)。訴え/申請/告訴/提案/願書を取り下げる。","examples":[{"ja":"和解が成立したため、原告は訴えを取り下げた。","zh":"因为达成了和解，原告撤回了起诉。","casual":"話し合いがまとまったので、訴えをやめた。"},{"ja":"提出した申請に不備があったので、一度取り下げて出し直した。","zh":"提交的申请有缺漏，所以先撤回，重新提交了。","casual":"出した申請に間違いがあったので、いったん引っ込めて出し直した。"}],"quiz":{"q":"手続きのミスに気づいて、提出した申請を（取り下げた／取り上げた）。","a":"取り下げた"}},{"id":126,"input":"訴え","word":"訴え","reading":"うったえ","kanji":"訴え","pos":"名词（动词：訴える，下一段他动词）","meaning":["诉讼、起诉","申诉、诉苦、投诉（痛みを訴える）","呼吁、诉求"],"frequency":"中高","paraphrases":["訴訟","裁判","苦情","文句","主張"],"mnemonic":"動词助词：〜を訴える(控告、申诉)/〜に訴える(诉诸：武力に訴える、心に訴える)。訴え(民事诉讼)/告訴(被害人向警方)/起訴(检察官公诉)。医疗：頭痛を訴える=主诉。","examples":[{"ja":"彼女は、会社を相手に訴えを起こした。","zh":"她向公司提起了诉讼。","casual":"彼女は、会社を相手に裁判を起こした。"},{"ja":"患者は、胸の痛みを訴えて病院に来た。","zh":"患者说胸口疼，来到了医院。","casual":"患者さんは、胸が痛いと言って病院に来た。"}],"quiz":{"q":"この映画は、観る人の心（に／を）訴える力がある。","a":"に"}},{"id":127,"input":"白紙","word":"白紙","reading":"はくし","kanji":"白紙","pos":"名词","meaning":["白纸、空白的纸","空白状态、毫无先入之见","（计划、约定）作废，回到原点（白紙に戻す／白紙になる）"],"frequency":"高","paraphrases":["なかったことにする","振り出しに戻る","ゼロから始める","取りやめる"],"mnemonic":"整句：白紙に戻す／白紙になる。白紙撤回/白紙委任/頭が真っ白になる。白紙(取消并回到零点)/キャンセル(具体手续)/中止(中途停止，之后可能继续)。","examples":[{"ja":"資金の問題で、新しいビルの建設計画は白紙になった。","zh":"因为资金问题，新大楼的建设计划泡汤了。","casual":"お金の問題で、新しいビルを建てる話はなかったことになった。"},{"ja":"先入観を捨てて、白紙の状態から考えてみよう。","zh":"抛开成见，从零开始想一想吧。","casual":"先入観を捨てて、ゼロから考えてみよう。"}],"quiz":{"q":"双方の意見が合わず、契約の話は（白紙／白髪）に戻った。","a":"白紙"}},{"id":128,"input":"切り返し","word":"切り返し","reading":"きりかえし","kanji":"切り返し","pos":"名词（动词：切り返す，五段）","meaning":["巧妙回应、反驳（机智地接住并回一句）","倒车时来回调整方向","运动里的急转向、反击","电影剪辑：对话场景的来回切换镜头"],"frequency":"中等","paraphrases":["言い返す","うまく返す","受け答え","機転を利かせて答える","入れ直す"],"mnemonic":"切る+返す。〜返し家族：恩返し/仕返し/裏返し/切り返し。切り返し(机智回应，多褒义)/言い返す(顶嘴)/受け流す(轻松躲开)。","examples":[{"ja":"上司の皮肉に、彼女はユーモアのある切り返しで場を和ませた。","zh":"面对上司的讽刺，她用幽默的回应缓和了气氛。","casual":"上司の嫌味に、彼女は面白く上手に返して、場を和ませた。"},{"ja":"狭い駐車場で、何度も切り返しをしてようやく車を入れた。","zh":"在狭窄的停车场里，来回调整了好几次，才把车停进去。","casual":"狭い駐車場で、何度も入れ直して、やっと車を停めた。"}],"quiz":{"q":"狭い道で車の向きを変えるため、何度も（切り返し／切り上げ）をした。","a":"切り返し"}},{"id":129,"input":"ダメージ","word":"ダメージ","reading":"ダメージ","kanji":"","pos":"名词（外来语 damage）","meaning":["损伤、损坏","打击、精神创伤","游戏：伤害值","时尚、美容：受损、做旧（ダメージヘア／ジーンズ）"],"frequency":"高","paraphrases":["傷","痛手","打撃","ショック","被害"],"mnemonic":"-age→ージ，同メッセージ/イメージ/ページ。与「ダメ(駄目)」来源无关。ダメージを受ける/与える/が大きい/が残る。","examples":[{"ja":"紫外線は、肌や髪に大きなダメージを与える。","zh":"紫外线会给皮肤和头发带来很大的伤害。","casual":"紫外線は、肌や髪をひどく傷める。"},{"ja":"大事な試合に負けて、精神的なダメージが大きかった。","zh":"输掉了重要的比赛，精神上受到很大打击。","casual":"大事な試合に負けて、すごくショックだった。"}],"quiz":{"q":"髪を毎日強く熱して、（ダメージ／ダメ）ヘアになってしまった。","a":"ダメージ"}},{"id":130,"input":"臆病者","word":"臆病者","reading":"おくびょうもの","kanji":"臆病者","pos":"名词","meaning":["胆小鬼、胆怯的人（遇到危险困难就害怕退缩，多带贬义）"],"frequency":"中等","paraphrases":["怖がり","ビビり","弱虫","小心者","意気地なし","腰抜け"],"mnemonic":"臆(内心)+病+者。「臆」的词：臆する/臆測/臆面もなく。臆病者(因害怕不敢行动)vs 卑怯者(不光明正大)。臆病風に吹かれる。","examples":[{"ja":"失敗が怖くて挑戦できない自分を、臆病者だと思っている。","zh":"我觉得自己是个因为怕失败而不敢挑战的胆小鬼。","casual":"失敗が怖くて挑戦できない自分を、ビビりだと思っている。"},{"ja":"臆病者と言われても、危険な場所には行きたくない。","zh":"就算被说成胆小鬼，我也不想去危险的地方。","casual":"怖がりだと言われても、危ないところには行きたくない。"}],"quiz":{"q":"暗い道を一人で歩けないなんて、本当に（臆病者／力持ち）だね。","a":"臆病者"}},{"id":131,"input":"バーベル","word":"バーベル","reading":"バーベル","kanji":"","pos":"名词（外来语 barbell）","meaning":["杠铃（长杆两端装杠铃片，练深蹲、卧推、硬拉，也用于举重）"],"frequency":"中等","paraphrases":["ウエイト","重り","筋トレ器具","バー"],"mnemonic":"バー(bar)+ベル(bell)。バーベル(长杆双手举)/ダンベル(短杆，哑铃)/ケトルベル(壶铃)。ベンチプレス/スクワット/デッドリフト。別混：バーベキュー。","examples":[{"ja":"ジムでバーベルを使って、スクワットをしている。","zh":"在健身房用杠铃做深蹲。","casual":"ジムで重りの付いた棒を使って、スクワットをしている。"},{"ja":"バーベルは重いので、最初は軽い重さから始めた方がいい。","zh":"杠铃很重，一开始最好从轻的重量开始。"}],"quiz":{"q":"両手で長い棒を持ち上げて、スクワットやベンチプレスをする器具は（バーベル／ダンベル）という。","a":"バーベル"}},{"id":132,"input":"居合わせ","word":"居合わせる","reading":"いあわせ（いあわせる）","kanji":"居合わせる","pos":"下一段自动词","meaning":["碰巧在场（没有特意安排，正好遇上某件事）"],"frequency":"中等","paraphrases":["たまたまいる","偶然そこにいた","ちょうどそこにいた","現場にいた人"],"mnemonic":"居る+合わせる。整句：〜に居合わせる。居合わせる(偶然在场)/出くわす(遇到事件)/立ち会う(受邀见证)。居合(いあい，剑术)是另一个词。","examples":[{"ja":"事故の現場にたまたま居合わせた看護師が、応急処置をした。","zh":"碰巧在事故现场的护士进行了急救。","casual":"事故の現場にたまたまいた看護師さんが、応急処置をした。"},{"ja":"その場に居合わせた全員が、彼の言葉に驚いた。","zh":"当时在场的所有人，都被他的话吓了一跳。"}],"quiz":{"q":"火事の現場に（居合わせた／行き合わせた）人が、すぐに消防に連絡した。","a":"居合わせた"}},{"id":133,"input":"死別","word":"死別","reading":"しべつ","kanji":"死別","pos":"名词（サ变）","meaning":["因对方去世而永远分别（多指配偶、父母、孩子、亲友）"],"frequency":"中等（偏书面）","paraphrases":["亡くなる","先立たれる","永遠の別れ","最期の別れ"],"mnemonic":"死+別。死別(因死亡)/生き別れ・生別(都活着却失散)/離別(离别，常指离婚)/別離(文学)。统计资料常见「死別・離別」并列。","examples":[{"ja":"彼女は若くして夫と死別し、一人で子どもを育ててきた。","zh":"她年纪轻轻就和丈夫死别，一个人把孩子养大。","casual":"彼女は若くして夫に先立たれ、一人で子どもを育ててきた。"},{"ja":"幼いころに父と死別したため、祖父母に育てられた。","zh":"小时候父亲就去世了，所以是由祖父母带大的。","casual":"小さいころに父が亡くなったので、祖父母に育てられた。"}],"quiz":{"q":"家族が亡くなって、二度と会えなくなる別れを（死別／生き別れ）という。","a":"死別"}},{"id":134,"input":"鯨","word":"鯨","reading":"くじら","kanji":"鯨","pos":"名词","meaning":["鲸、鲸鱼（海洋哺乳动物）","鲸肉","固定说法里的「大」（鯨飲）"],"frequency":"中等","paraphrases":["クジラ","ホエール","海の大きな生き物"],"mnemonic":"魚+京=大到惊人的鱼，但鲸是哺乳动物不是鱼。クジラ(大，多用须过滤小生物吃)vs イルカ(小，吃鱼)。鯨幕/鯨尺/鯨飲馬食/潮を吹く/ホエールウォッチング。","examples":[{"ja":"船に乗って、海に現れた大きな鯨を見た。","zh":"乘船出海，看到了出现在海面上的大鲸鱼。","casual":"船に乗って、海に出てきた大きなクジラを見た。"},{"ja":"鯨は魚ではなく、人間と同じ哺乳類だ。","zh":"鲸不是鱼，和人类一样是哺乳动物。"}],"quiz":{"q":"海にすむ大きな動物で、頭の上から潮を吹くのは（クジラ／イルカ）だ。","a":"クジラ"}}]}</script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const load=k=>{try{return new Set(JSON.parse(localStorage.getItem(k)||'[]').map(String))}catch(e){return new Set()}};
const save=()=>{try{localStorage.setItem('jv_star',JSON.stringify([...S]));localStorage.setItem('jv_done',JSON.stringify([...M]))}catch(e){}};
let D=[],S=load('jv_star'),M=load('jv_done'),tab='list',filter='all',kw='';
let fc={deck:[],i:0,flip:false,all:false},qz={cur:null,show:false,right:0,total:0,pool:[]};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

/* ===== 字段映射：换了JSON结构，只需改这里 =====
   左边是页面用的字段，右边是你的JSON里可能出现的字段名，按顺序取第一个有值的。 */
const MAP={
  id:['id','ID','no','index','key'],
  word:['word','term','vocab','expression','headword','text','单词','単語','日本語'],
  reading:['reading','kana','yomi','furigana','pronunciation','读音','読み'],
  kanji:['kanji','writing','汉字','漢字'],
  pos:['pos','part_of_speech','品詞','词性'],
  meaning:['meaning','meanings','definition','definitions','gloss','translation','意思','释义'],
  frequency:['frequency','freq','频率'],
  paraphrases:['paraphrases','synonyms','alternatives','言い換え'],
  mnemonic:['mnemonic','memo','tip','hint','记忆'],
  examples:['examples','example','sentences'],
  quiz:['quiz','question'],
  note:['note','notes','remark'],
  input:['input']
};
const SUB={ex:{ja:['ja','jp','japanese','text','sentence'],zh:['zh','cn','translation','meaning'],casual:['casual','colloquial']},qz:{q:['q','question'],a:['a','answer']}};
const ARR_KEYS=['entries','words','items','data','list','vocab','records'];
const pick=(o,keys)=>{for(const k of keys){const v=o[k];if(v!==undefined&&v!==null&&v!==''&&!(Array.isArray(v)&&!v.length))return v}return ''};
const toArr=v=>Array.isArray(v)?v.map(String).filter(Boolean):(v===''||v==null?[]:String(v).split(/[\n；;]/).map(s=>s.trim()).filter(Boolean));
function normEx(v){
  if(!v)return [];
  if(!Array.isArray(v))v=[v];
  return v.map(e=>typeof e==='object'&&e?{ja:pick(e,SUB.ex.ja),zh:pick(e,SUB.ex.zh),casual:pick(e,SUB.ex.casual)}:{ja:String(e),zh:'',casual:''}).filter(e=>e.ja);
}
function normQuiz(v){
  if(!v)return null;
  if(typeof v==='string')return {q:v,a:''};
  const q=pick(v,SUB.qz.q);return q?{q:String(q),a:String(pick(v,SUB.qz.a))}:null;
}
function findList(data){
  if(Array.isArray(data))return data;
  if(data&&typeof data==='object'){
    for(const k of ARR_KEYS)if(Array.isArray(data[k]))return data[k];
    for(const k in data)if(Array.isArray(data[k]))return data[k];
  }
  return [];
}
function normalize(raw,i){
  const o=typeof raw==='object'&&raw?raw:{word:raw};
  const g=k=>pick(o,MAP[k]);
  return {id:String(g('id')!==''?g('id'):i+1),input:String(g('input')),word:String(g('word')),reading:String(g('reading')),kanji:String(g('kanji')),
    pos:String(g('pos')),meaning:toArr(g('meaning')),frequency:String(g('frequency')),paraphrases:toArr(g('paraphrases')),
    mnemonic:String(g('mnemonic')),examples:normEx(g('examples')),quiz:normQuiz(g('quiz')),note:String(g('note'))};
}
function start(data){
  D=findList(data).map(normalize);
  const seen=new Set();D.forEach((x,i)=>{if(seen.has(x.id))x.id=String(i+1)+'_'+i;seen.add(x.id)});
  document.title=(data&&data.title)||'日语单词本';
  if(!D.length||!D.some(x=>x.word)){
    $('#app').innerHTML='<div class="empty">没有识别到单词。<br>请检查 JSON 是否是数组（或含数组的对象），<br>并在 index.html 开头的 MAP 里加上你的字段名。</div>';stat();return;
  }
  render();
}
const EMB=document.getElementById('embedded');
const loadData=EMB&&EMB.textContent.trim()?Promise.resolve(JSON.parse(EMB.textContent)):fetch('japanese_vocab.json').then(r=>{if(!r.ok)throw 0;return r.json()});
loadData.then(start).catch(()=>{
  $('#app').innerHTML='<div class="empty">没能自动读取 japanese_vocab.json。<br>请把它和 index.html 放在同一目录并通过网址打开，或手动选择文件：<br><br><input type="file" id="pick" accept=".json,application/json"></div>';
  $('#pick').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>start(JSON.parse(t)))};
});

function stat(){
  $('#stat').textContent='已掌握 '+M.size+' / '+D.length+'，收藏 '+S.size;
  $('#bar').style.width=(D.length?M.size/D.length*100:0)+'%';
}
function render(){
  stat();
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  if(tab==='list')renderList();else if(tab==='fc')renderFc();else renderQz();
}
$('#nav').onclick=e=>{const t=e.target.dataset.t;if(!t)return;tab=t;if(t==='fc')buildDeck();if(t==='qz')buildQz();render()};

/* 词表 */
function match(x){
  if(filter==='star'&&!S.has(x.id))return false;
  if(filter==='todo'&&M.has(x.id))return false;
  if(filter==='done'&&!M.has(x.id))return false;
  if(!kw)return true;
  const s=[x.input,x.word,x.reading,x.kanji,...(x.meaning||[])].join(' ').toLowerCase();
  return s.includes(kw);
}
function card(x){
  const ex=(x.examples||[]).map(e=>'<div class="ex"><div class="ja">'+esc(e.ja)+'</div><div class="z">'+esc(e.zh)+'</div>'+(e.casual?'<div class="k">口语：'+esc(e.casual)+'</div>':'')+'</div>').join('');
  const qz=x.quiz?'<h4>自测</h4><div class="qz"><div>'+esc(x.quiz.q)+'</div><details><summary>看答案</summary><b>'+esc(x.quiz.a)+'</b></details></div>':'';
  return '<details class="c" data-id="'+x.id+'"><summary><span class="w ja">'+esc(x.word)+'</span><span class="rd">'+esc(x.reading)+'</span><span class="m1">'+esc((x.meaning||[])[0])+'</span>'
  +'<button class="ic dn'+(M.has(x.id)?' on':'')+'" data-a="done" title="已掌握" aria-label="标记已掌握">✓</button><button class="ic'+(S.has(x.id)?' on':'')+'" data-a="star" title="收藏" aria-label="收藏">★</button></summary>'
  +'<div class="body">'
  +(x.input&&x.input!==x.word?'<div class="note">你发的是「'+esc(x.input)+'」</div>':'')
  +'<h4>词性与频率</h4><div>'+esc(x.pos)+(x.kanji?'　汉字：<span class="ja">'+esc(x.kanji)+'</span>':'')+'　频率：'+esc(x.frequency)+'</div>'
  +'<h4>意思</h4><ul>'+(x.meaning||[]).map(m=>'<li>'+esc(m)+'</li>').join('')+'</ul>'
  +((x.paraphrases||[]).length?'<h4>日常口语说法</h4><div class="tags">'+x.paraphrases.map(p=>'<span class="ja">'+esc(p)+'</span>').join('')+'</div>':'')
  +(x.mnemonic?'<h4>记忆钩子</h4><div>'+esc(x.mnemonic)+'</div>':'')
  +'<h4>例句</h4>'+ex+qz
  +(x.note?'<div class="note">'+esc(x.note)+'</div>':'')
  +'</div></details>';
}
function renderList(){
  const opts=[['all','全部'],['todo','未掌握'],['done','已掌握'],['star','收藏']];
  const open=new Set([...document.querySelectorAll('details.c[open]')].map(d=>d.dataset.id));
  $('#app').innerHTML='<input type="search" id="kw" placeholder="搜索单词、读音、汉字或中文意思" value="'+esc(kw)+'">'
  +'<div class="chips">'+opts.map(o=>'<button data-f="'+o[0]+'"'+(filter===o[0]?' class="on"':'')+'>'+o[1]+'</button>').join('')+'</div><div id="lst"></div>';
  fillList(open);
  $('#kw').oninput=e=>{kw=e.target.value.trim().toLowerCase();fillList(new Set())};
  $('.chips').onclick=e=>{const f=e.target.dataset.f;if(!f)return;filter=f;renderList()};
}
function fillList(open){
  const r=D.filter(match);
  $('#lst').innerHTML=r.length?r.map(card).join(''):'<div class="empty">没有符合条件的单词，换个关键词或筛选试试。</div>';
  document.querySelectorAll('details.c').forEach(d=>{if(open.has(d.dataset.id))d.open=true});
}
$('#app').addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  e.preventDefault();
  const id=b.closest('details').dataset.id,set=b.dataset.a==='star'?S:M;
  set.has(id)?set.delete(id):set.add(id);save();
  b.classList.toggle('on',set.has(id));stat();
});

/* 闪卡 */
function buildDeck(){
  fc.deck=shuffle(D.filter(x=>fc.all||!M.has(x.id)));fc.i=0;fc.flip=false;
}
function renderFc(){
  const x=fc.deck[fc.i];
  const top='<label class="stat"><input type="checkbox" id="all"'+(fc.all?' checked':'')+'> 包含已掌握的词</label>';
  if(!x){$('#app').innerHTML=top+'<div class="empty">'+(fc.deck.length?'这一轮学完了。':'没有需要复习的词了。')+'</div><div class="row"><button class="go" id="again">重新洗牌再来一轮</button></div>';bindFc();return}
  const e=(x.examples||[])[0];
  const front='<div class="big ja">'+esc(x.word)+'</div><div class="hint">点击卡片或按空格键翻面</div>';
  const back='<div class="back"><div class="rdb ja">'+esc(x.reading)+'</div><div class="rd" style="text-align:center">'+esc(x.pos)+(x.kanji?'　'+esc(x.kanji):'')+'</div>'
   +'<ul>'+(x.meaning||[]).map(m=>'<li>'+esc(m)+'</li>').join('')+'</ul>'+(e?'<div class="ex"><div class="ja">'+esc(e.ja)+'</div><div class="z">'+esc(e.zh)+'</div></div>':'')+'</div>';
  $('#app').innerHTML=top+'<div class="pg">'+(fc.i+1)+' / '+fc.deck.length+'</div><div class="fc" id="fcard" tabindex="0" role="button" aria-label="翻转卡片">'+(fc.flip?back:front)+'</div>'
  +'<div class="row"><button class="no" id="no">还不熟</button><button class="ok" id="yes">认识了</button></div>'
  +'<div class="row"><button id="prev">上一张</button><button id="next">下一张</button></div>';
  bindFc();
}
function bindFc(){
  const a=$('#all');if(a)a.onchange=e=>{fc.all=e.target.checked;buildDeck();render()};
  const g=$('#again');if(g)g.onclick=()=>{buildDeck();render()};
  const c=$('#fcard');if(!c)return;
  c.onclick=()=>{fc.flip=!fc.flip;renderFc()};
  $('#prev').onclick=()=>fcGo(-1);$('#next').onclick=()=>fcGo(1);
  $('#yes').onclick=()=>{M.add(fc.deck[fc.i].id);save();stat();fcGo(1)};
  $('#no').onclick=()=>{S.add(fc.deck[fc.i].id);save();stat();fcGo(1)};
}
function fcGo(d){
  fc.i=fc.i+d;fc.flip=false;
  if(fc.i<0)fc.i=0;
  if(fc.i>=fc.deck.length){fc.deck=[];}
  renderFc();
}
document.addEventListener('keydown',e=>{
  if(tab!=='fc'||!fc.deck.length||e.target.tagName==='INPUT')return;
  if(e.key===' '||e.key==='Enter'){e.preventDefault();fc.flip=!fc.flip;renderFc()}
  else if(e.key==='ArrowRight')fcGo(1);else if(e.key==='ArrowLeft')fcGo(-1);
});

/* 测验 */
function buildQz(){qz.pool=shuffle(D.filter(x=>x.quiz));qz.cur=qz.pool.pop()||null;qz.show=false;qz.right=0;qz.total=0}
function renderQz(){
  const x=qz.cur;
  const sc='<div class="pg">本轮答对 '+qz.right+' / '+qz.total+'，剩余 '+qz.pool.length+' 题</div>';
  if(!x){$('#app').innerHTML=sc+'<div class="empty">题目做完了。</div><div class="row"><button class="go" id="qr">重新开始</button></div>';$('#qr').onclick=()=>{buildQz();render()};return}
  $('#app').innerHTML=sc+'<div class="qbox"><div class="rd">'+esc(x.word)+'</div><div class="q ja">'+esc(x.quiz.q)+'</div>'
  +(qz.show?'<div class="ans">答案：'+esc(x.quiz.a)+'</div><div class="row"><button class="no" id="bad">答错了</button><button class="ok" id="good">答对了</button></div>':'<div class="row"><button class="go" id="sh">看答案</button></div>')+'</div>';
  if(qz.show){
    $('#good').onclick=()=>qzNext(true);$('#bad').onclick=()=>qzNext(false);
  }else $('#sh').onclick=()=>{qz.show=true;renderQz()};
}
function qzNext(ok){
  qz.total++;if(ok)qz.right++;else{S.add(qz.cur.id);save();stat()}
  qz.cur=qz.pool.pop()||null;qz.show=false;renderQz();
}
</script>
