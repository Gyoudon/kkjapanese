<header><div class="wrap"><div class="eyebrow">JAPANESE · REVIEW ROOM</div><div class="hero"><div><h1>我的日语复习室</h1><p class="subtitle">先自己说，再看自然表达。把练过的内容集中起来，反复练到能脱口而出。</p></div><div class="hero-mark" aria-hidden="true">言葉<br>✳</div></div></div></header>
<main class="wrap">
<div class="stats"><div class="stat"><strong id="total">0</strong><span>复习内容</span></div><div class="stat"><strong id="todo">0</strong><span>待复习</span></div><div class="stat"><strong id="done">0</strong><span>已掌握</span></div></div>
<section class="panel"><h2>找一找今天要练什么</h2><div class="controls"><input id="search" type="search" placeholder="搜索中文、日语、句型或讲解…"><select id="category"><option value="">全部类别</option></select><select id="status"><option value="">全部状态</option><option value="todo">待复习</option><option value="done">已掌握</option><option value="wrong">错题／不熟</option><option value="favorite">收藏</option></select></div><div class="actions"><button id="random">🎲 随机复习</button><button class="secondary" id="reviewWrong">复习错题</button><button class="plain" id="showAll">展开答案</button><button class="plain" id="hideAll">收起答案</button></div><div class="progress"><span id="bar"></span></div><div class="muted" id="progressText">掌握进度</div></section>
<div class="section-head"><h2>复习卡片</h2><span class="muted" id="resultCount"></span></div><div id="cards"></div>
<section class="panel"><h2>批量导入 / 导出</h2><p class="muted">以后不用逐题录入。整理好一批题目后，导入 JSON 文件即可合并；导出可以备份你新增的题目和复习状态。</p><div class="actions"><button id="export" class="secondary">导出题库 JSON</button><button id="import" class="plain">导入题库 JSON</button><input id="importFile" type="file" accept=".json,application/json" class="hidden"></div><p class="muted">导入时会自动跳过重复题目，不会清空原题库。建议每次大批量更新前先导出一次。</p></section>
<section class="panel"><h2>临时添加一条</h2><p class="muted">只有临时想到的新句子才需要在这里加；历史内容已经批量整理进题库。</p><form id="addForm" class="form-grid"><input id="newPrompt" placeholder="中文提示 / 正面内容" required><input id="newCategory" placeholder="类别，例如：可能形" value="口语句型"><input id="newJP" class="full" placeholder="日语参考答案" required><input id="newPattern" placeholder="重点句型，例如：〜ば〜ほど"><input id="newHint" placeholder="提示（可选）"><textarea id="newNote" class="full" placeholder="自然度说明 / 语法讲解（可选）"></textarea><button type="submit" class="full">加入复习库</button></form></section>
<div class="footer">数据保存在当前浏览器。更换设备或清除浏览器数据前，请先导出 JSON 备份。</div>
</main>
<script>
const starterData=[{"kind":"sentence","category":"口语句型","pattern":"〜ば〜ほど","prompt":"越担心说错，就越不敢开口。","cn":"越担心说错，就越不敢开口。","jp":"間違えるのが心配になればなるほど、口を開けなくなる。","hint":"","note":"表示“越……越……”。前后通常使用同一词语或相互关联的表达。","status":"todo","source":"旧版 index.html","id":"jp-001","favorite":false,"wrong":false,"created":"2026-10-27"},{"kind":"sentence","category":"口语句型","pattern":"〜つもりだったのに","prompt":"本来打算早点睡，回过神来却又在看手机。","cn":"本来打算早点睡，回过神来却又在看手机。","jp":"早く寝るつもりだったのに、気づいたらまたスマホを見ていた。","hint":"","note":"「のに」表达实际结果和原本预想不一样，常带有遗憾或意外。","status":"todo","source":"旧版 index.html","id":"jp-002","favorite":false,"wrong":false,"created":"2026-10-27"},{"kind":"sentence","category":"口语句型","pattern":"どうすればいいか分からない","prompt":"我不知道该怎么解释自己的想法。","cn":"我不知道该怎么解释自己的想法。","jp":"自分の考えをどう説明すればいいか分からない。","hint":"","note":"把“该怎么做”作为一个整体放进句子里。常用结构：疑问词＋ばいいか分からない。","status":"todo","source":"旧版 index.html","id":"jp-003","favorite":false,"wrong":false,"created":"2026-10-27"},{"kind":"sentence","category":"可能形","pattern":"可能形＋が／を","prompt":"我听不懂日本人说的话。","cn":"我听不懂日本人说的话。","jp":"日本人の話が聞き取れない。","hint":"","note":"强调能否听懂内容时，常用「話が聞き取れない」。单纯表示没听到声音则可说「聞こえない」。","status":"todo","source":"旧版 index.html","id":"jp-004","favorite":false,"wrong":false,"created":"2026-10-27"},{"kind":"sentence","category":"可能形","pattern":"可能形表达做不到","prompt":"我没办法顺利表达自己想说的话。","cn":"我没办法顺利表达自己想说的话。","jp":"言いたいことがうまく伝えられない。","hint":"","note":"「伝える」的可能形是「伝えられる」。口语中也会听到「伝えれる」，但学习和正式表达建议使用「伝えられる」。","status":"todo","source":"旧版 index.html","id":"jp-005","favorite":false,"wrong":false,"created":"2026-10-27"},{"kind":"sentence","category":"口语句型","pattern":"〜ようとすると","prompt":"一想开口说话，就不知道该说什么了。","cn":"一想开口说话，就不知道该说什么了。","jp":"話そうとすると、何を言えばいいか分からなくなる。","hint":"","note":"「意志形＋とすると」表示正要做某事时，发生某种情况；也可以表示尝试做某事。","status":"todo","source":"旧版 index.html","id":"jp-006","favorite":false,"wrong":false,"created":"2026-10-27"},{"kind":"sentence","category":"口语句型","pattern":"〜たほうがいい","prompt":"最好多出声练习。","cn":"最好多出声练习。","jp":"もっと声に出して練習したほうがいい。","hint":"","note":"给建议时使用。动词た形＋ほうがいい。否定建议常用「〜ないほうがいい」。","status":"todo","source":"旧版 index.html","id":"jp-007","favorite":false,"wrong":false,"created":"2026-10-27"},{"kind":"sentence","category":"心情与日常","pattern":"〜ないと気になる","prompt":"必须做的事情没完成，就会一直惦记着。","cn":"必须做的事情没完成，就会一直惦记着。","jp":"やらなきゃいけないことが終わらないと、ずっと気になる。","hint":"","note":"「気になる」表示心里在意、放不下。口语里「やらなきゃいけない」是「やらなければいけない」的常见缩略。","status":"todo","source":"旧版 index.html","id":"jp-008","favorite":false,"wrong":false,"created":"2026-10-27"},{"kind":"sentence","category":"心情与日常","pattern":"気づいたら〜ていた","prompt":"本来只打算休息五分钟，回过神来却已经睡着了。","cn":"本来只打算休息五分钟，回过神来却已经睡着了。","jp":"5分だけ休むつもりだったのに、気づいたら寝てしまっていた。","hint":"","note":"「気づいたら」常用来表达不知不觉发现某个结果已经发生。","status":"todo","source":"旧版 index.html","id":"jp-009","favorite":false,"wrong":false,"created":"2026-10-27"},{"kind":"sentence","category":"逆接・转折","pattern":"〜のは分かっているのに","prompt":"明明知道早点开始比较好，却又纠结该从哪里开始。","cn":"明明知道早点开始比较好，却又纠结该从哪里开始。","jp":"早く始めたほうがいいのは分かっているのに、何から始めればいいか迷ってしまう。","hint":"","note":"「〜のは分かっている」把前面的内容作为已知事实；「のに」引出与预期不符的结果。","status":"todo","source":"旧版 index.html","id":"jp-010","favorite":false,"wrong":false,"created":"2026-10-27"},{"kind":"sentence","category":"口语句型","pattern":"〜ようになる","prompt":"我觉得自己比以前更容易组织句子了。","cn":"我觉得自己比以前更容易组织句子了。","jp":"前より文を組み立てやすくなってきた。","hint":"","note":"「〜やすくなる」表示变得容易做某事；「〜てきた」强调变化逐渐发展到现在。","status":"todo","source":"旧版 index.html","id":"jp-011","favorite":false,"wrong":false,"created":"2026-10-27"},{"kind":"sentence","category":"心情与日常","pattern":"〜つい〜てしまう","prompt":"因为担心出错，不知不觉就在脑子里反复组织句子。","cn":"因为担心出错，不知不觉就在脑子里反复组织句子。","jp":"間違いが心配で、つい頭の中で何度も文を組み立ててしまう。","hint":"","note":"「つい」表示不由得、忍不住；「〜てしまう」常带有不自觉或遗憾的语气。","status":"todo","source":"旧版 index.html","id":"jp-012","favorite":false,"wrong":false,"created":"2026-10-27"},{"kind":"sentence","category":"怎么做才好","pattern":"怎么做才好","prompt":"我不知道该怎么向日本人解释自己的想法。","cn":"我不知道该怎么向日本人解释自己的想法。","jp":"日本人に自分の考えをどう説明すればいいか分からない。","hint":"","note":"どう＋动词条件形＋ばいいか分からない。説明する→説明すれば。","source":"旧版口语复习页","id":"jp-013","status":"todo","favorite":false,"wrong":false,"created":"2026-10-27"},{"kind":"sentence","category":"明明……却……","pattern":"明明……却……","prompt":"明明学了很多语法，实际说的时候却用不出来。","cn":"明明学了很多语法，实际说的时候却用不出来。","jp":"文法をたくさん勉強したのに、実際に話そうとすると全然使えない。","hint":"","note":"〜のに表示预期与现实相反；話そうとすると＝一想要开口说时。","source":"旧版口语复习页","id":"jp-014","status":"todo","favorite":false,"wrong":false,"created":"2026-10-27"},{"kind":"sentence","category":"越……越……","pattern":"越……越……","prompt":"越担心说错，就越不敢开口。","cn":"越担心说错，就越不敢开口。","jp":"間違えるのを心配すればするほど、口を開けなくなる。","hint":"","note":"动词条件形＋ば＋同一动词辞书形＋ほど。也可以说「間違いを気にすればするほど」。","source":"旧版口语复习页","id":"jp-015","status":"todo","favorite":false,"wrong":false,"created":"2026-10-27"},{"kind":"sentence","category":"可能形","pattern":"可能形","prompt":"我听得懂日本人说的话，却不知道怎么自然地表达自己的想法。","cn":"我听得懂日本人说的话，却不知道怎么自然地表达自己的想法。","jp":"日本人の話は聞き取れるのに、自分の考えをどう自然に伝えればいいか分からない。","hint":"","note":"聞き取れる＝听得清并理解；は带有对比语气。伝える→伝えられる。","source":"旧版口语复习页","id":"jp-016","status":"todo","favorite":false,"wrong":false,"created":"2026-10-27"},{"kind":"sentence","category":"本来打算……","pattern":"本来打算……","prompt":"本来打算早点睡，结果一直看手机，回过神来已经这么晚了。","cn":"本来打算早点睡，结果一直看手机，回过神来已经这么晚了。","jp":"早く寝るつもりだったのに、ずっとスマホを見ていて、気づいたらもうこんな時間だった。","hint":"","note":"〜つもりだったのに＋気づいたら。口语中「ずっとスマホ見てて」也很自然。","source":"旧版口语复习页","id":"jp-017","status":"todo","favorite":false,"wrong":false,"created":"2026-10-27"},{"kind":"sentence","category":"应该先……","pattern":"应该先……","prompt":"我知道应该多练习，可每次想开口时都会担心自己说得自不自然。","cn":"我知道应该多练习，可每次想开口时都会担心自己说得自不自然。","jp":"もっと練習したほうがいいのは分かってるけど、話そうとすると、自然に話せるか心配になる。","hint":"","note":"「〜たほうがいいのは分かってるけど」适合表达“我知道是该……，可是……”。","source":"旧版口语复习页","id":"jp-018","status":"todo","favorite":false,"wrong":false,"created":"2026-10-27"},{"kind":"sentence","category":"变得能够……","pattern":"变得能够……","prompt":"我想练习到能自然地说日语。","cn":"我想练习到能自然地说日语。","jp":"日本語を自然に話せるようになるまで練習したい。","hint":"","note":"可能形＋ようになる＝逐渐变得能够……；「話せるようになるには、どう練習すればいい？」","source":"旧版口语复习页","id":"jp-019","status":"todo","favorite":false,"wrong":false,"created":"2026-10-27"},{"kind":"sentence","category":"不是不……","pattern":"不是不……","prompt":"不是完全不知道想说什么，而是不知道怎么用日语表达。","cn":"不是完全不知道想说什么，而是不知道怎么用日语表达。","jp":"何を言いたいのか分からないわけじゃなくて、日本語でどう表現すればいいか分からない。","hint":"","note":"〜わけじゃなくて＝并不是……；后半句说明真正的问题。","source":"旧版口语复习页","id":"jp-020","status":"todo","favorite":false,"wrong":false,"created":"2026-10-27"},{"kind":"translate","category":"中文造句","pattern":"予定を立てる／どう〜すればいいか分からない","prompt":"我不知道该怎么安排每天的学习计划。","cn":"我不知道该怎么安排每天的学习计划。","jp":"毎日の勉強の予定をどう立てればいいか分からない。","hint":"予定を立てる／どう〜すればいいか分からない","note":"先不看答案，自己用日语说完整句子。","source":"旧版口语复习页","id":"jp-021","status":"todo","favorite":false,"wrong":false,"created":"2026-10-27"},{"kind":"translate","category":"中文造句","pattern":"〜のに／何をすればいいか／結局","prompt":"明明想早点开始，却因为不知道该做什么而犹豫，最后什么也没做。","cn":"明明想早点开始，却因为不知道该做什么而犹豫，最后什么也没做。","jp":"早く始めたほうがいいのは分かっていたのに、何をすればいいか迷って、結局何もしなかった。","hint":"〜のに／何をすればいいか／結局","note":"先不看答案，自己用日语说完整句子。","source":"旧版口语复习页","id":"jp-022","status":"todo","favorite":false,"wrong":false,"created":"2026-10-27"},{"kind":"translate","category":"中文造句","pattern":"〜か心配する／〜ば〜ほど／伝えられない","prompt":"越担心自己说得不自然，就越难把想法表达出来。","cn":"越担心自己说得不自然，就越难把想法表达出来。","jp":"不自然に聞こえないか心配すればするほど、自分の考えをうまく伝えられなくなる。","hint":"〜か心配する／〜ば〜ほど／伝えられない","note":"先不看答案，自己用日语说完整句子。","source":"旧版口语复习页","id":"jp-023","status":"todo","favorite":false,"wrong":false,"created":"2026-10-27"},{"kind":"translate","category":"中文造句","pattern":"〜のは分かっているけど／いざ〜とすると","prompt":"我知道应该多练习，但一到真正要说的时候，就会在脑子里反复组织句子。","cn":"我知道应该多练习，但一到真正要说的时候，就会在脑子里反复组织句子。","jp":"もっと練習したほうがいいのは分かっているけど、いざ話そうとすると、頭の中で何度も文を組み立ててしまう。","hint":"〜のは分かっているけど／いざ〜とすると","note":"先不看答案，自己用日语说完整句子。","source":"旧版口语复习页","id":"jp-024","status":"todo","favorite":false,"wrong":false,"created":"2026-10-27"},{"kind":"translate","category":"可能形／口语","pattern":"可能形与自然表达","prompt":"我听不懂日本人的话。","cn":"我听不懂日本人的话。","jp":"日本人の話が聞き取れない。","hint":"想一想：是“没法听”，还是“听不清内容”？","note":"「聞き取れない」适合听到对方说话，却无法辨认具体内容的情况。如果是听到了但不理解意思，可以说「日本人の話が理解できない」。","source":"可能形练习页","id":"jp-025","status":"todo","favorite":false,"wrong":fal const KEY='jpReviewRoom_v2';
let items=[];let revealed=new Set();let currentFilter='';
const $=id=>document.getElementById(id);
function norm(s){return String(s||'').normalize('NFKC').toLowerCase().replace(/[\s。、，,.!?！？「」『』“”‘’]/g,'')}
function signature(x){return [x.kind,norm(x.prompt||x.cn),norm(x.jp),norm((x.options||[]).join('|'))].join('::')}
function load(){try{const saved=JSON.parse(localStorage.getItem(KEY)||'null');if(Array.isArray(saved)){items=saved;return;}}catch(e){}let legacy=[];try{const old=JSON.parse(localStorage.getItem('japaneseReviewLibrary_v1')||'null');if(Array.isArray(old))legacy=old.map((x,i)=>({...x,id:x.id||('legacy-'+i),kind:'sentence',prompt:x.cn||x.jp||'',favorite:!!x.favorite,wrong:!!x.wrong,source:'旧网页本机保存内容'}));}catch(e){}items=[...starterData.map(x=>({...x})),...legacy];dedupe();persist();}
function dedupe(){const seen=new Set();items=items.filter(x=>{const k=signature(x);if(seen.has(k))return false;seen.add(k);return true})}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){alert('浏览器储存空间不足。请先导出题库 JSON 备份。')}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fillCategories(){const sel=$('category'),old=sel.value;const cats=[...new Set(items.map(x=>x.category).filter(Boolean))].sort();sel.innerHTML='<option value="">全部类别</option>'+cats.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');if(cats.includes(old))sel.value=old}
function filteredItems(){const q=norm($('search').value),cat=$('category').value,st=$('status').value;return items.filter(x=>{const hay=[x.prompt,x.cn,x.jp,x.pattern,x.note,x.hint,x.category].join(' ');return(!q||norm(hay).includes(q))&&(!cat||x.category===cat)&&(!st||(st==='favorite'?x.favorite:st==='wrong'?x.wrong:st==='done'?x.status==='done':x.status!=='done'))})}
function render(){fillCategories();const filtered=filteredItems();$('total').textContent=items.length;$('todo').textContent=items.filter(x=>x.status!=='done').length;$('done').textContent=items.filter(x=>x.status==='done').length;const done=items.filter(x=>x.status==='done').length;$('bar').style.width=(items.length?done/items.length*100:0)+'%';$('progressText').textContent=`已掌握 ${done} / ${items.length} 条`; $('resultCount').textContent=`显示 ${filtered.length} 条`;
 if(!filtered.length){$('cards').innerHTML='<div class="empty">没有找到内容。试试其他关键词或类别。</div>';return;}
 $('cards').innerHTML=filtered.map(x=>{const open=revealed.has(x.id);const opts=x.options?.length?`<div class="hint">${x.options.map((o,i)=>`${String.fromCharCode(65+i)}. ${esc(o)}`).join('<br>')}</div>`:'';return `<article class="card" id="c-${esc(x.id)}"><div class="card-top"><span class="pill">${esc(x.category||'其他')}</span><span class="state">${x.status==='done'?'✓ 已掌握':x.wrong?'↻ 错题／不熟':'待复习'}${x.favorite?'　★ 已收藏':''}</span></div><div class="prompt">${esc(x.prompt||x.cn||x.pattern||'复习卡片')}</div>${x.hint?`<div class="hint">提示：${esc(x.hint)}</div>`:''}${x.kind==='choice'&&x.options?.length?opts:''}<textarea class="answer-input" data-answer="${esc(x.id)}" placeholder="先自己试着说 / 写（日语，可选）"></textarea><div class="actions"><button class="small" data-act="reveal" data-id="${esc(x.id)}">${open?'收起答案':'查看参考答案'}</button><button class="small secondary" data-act="status" data-id="${esc(x.id)}">${x.status==='done'?'改为待复习':'标记已掌握'}</button><button class="small plain" data-act="wrong" data-id="${esc(x.id)}">${x.wrong?'取消错题':'标记不熟'}</button><button class="small plain" data-act="fav" data-id="${esc(x.id)}">${x.favorite?'取消收藏':'☆ 收藏'}</button></div><div class="detail answer ${open?'show':''}"><div class="jp">${esc(x.jp||'（暂无参考答案）')}</div>${x.note?`<p><strong>用法 / 自然度：</strong>${esc(x.note)}</p>`:''}${x.pattern?`<p><strong>重点句型：</strong>${esc(x.pattern)}</p>`:''}${x.kind==='choice'&&Number.isInteger(x.correct)?`<p><strong>正确选项：</strong>${String.fromCharCode(65+x.correct)}${x.options?.[x.correct]?` · ${esc(x.options[x.correct])}`:''}</p>`:''}<p class="muted">来源：${esc(x.source||'复习库')}</p></div></article>`}).join('')}
$('cards').addEventListener('click',e=>{const b=e.target.closest('button[data-act]');if(!b)return;const x=items.find(v=>v.id===b.dataset.id);if(!x)return;switch(b.dataset.act){case'reveal':revealed.has(x.id)?revealed.delete(x.id):revealed.add(x.id);break;case'status':x.status=x.status==='done'?'todo':'done';break;case'wrong':x.wrong=!x.wrong;if(x.wrong)x.status='todo';break;case'fav':x.favorite=!x.favorite;break;}persist();render()});
$('search').addEventListener('input',render);$('category').addEventListener('change',render);$('status').addEventListener('change',render);
$('showAll').onclick=()=>{filteredItems().forEach(x=>revealed.add(x.id));render()};$('hideAll').onclick=()=>{revealed.clear();render()};$('random').onclick=()=>{const pool=items.filter(x=>x.status!=='done');const x=pool[Math.floor(Math.random()*pool.length)]||items[Math.floor(Math.random()*items.length)];if(!x)return;$('search').value='';$('category').value='';$('status').value='';render();revealed.delete(x.id);const el=$('c-'+x.id);if(el)el.scrollIntoView({behavior:'smooth',block:'center'})};$('reviewWrong').onclick=()=>{$('search').value='';$('category').value='';$('status').value='wrong';render()};
$('export').onclick=()=>download('japanese-review-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(items,null,2),'application/json');function download(name,text,type){const blob=new Blob([text],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url)}
$('import').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const parsed=JSON.parse(await f.text());const incoming=Array.isArray(parsed)?parsed:parsed.items;if(!Array.isArray(incoming))throw Error('格式');const before=items.length;const known=new Set(items.map(signature));let added=0;for(const x of incoming){if(!x||!(x.jp||x.prompt||x.cn))continue;const y={kind:x.kind||'sentence',category:x.category||'历史导入',pattern:x.pattern||'',prompt:x.prompt||x.cn||x.front||'',cn:x.cn||x.prompt||'',jp:x.jp||x.answer||'',hint:x.hint||'',note:x.note||x.explain||'',options:x.options||[],correct:x.correct,status:x.status==='done'?'done':'todo',favorite:!!x.favorite,wrong:!!x.wrong,source:x.source||'批量导入',id:'imp-'+Date.now()+'-'+added};const sig=signature(y);if(known.has(sig))continue;known.add(sig);items.push(y);added++;}persist();render();alert(`导入完成：新增 ${added} 条，跳过重复题目 ${Math.max(0,incoming.length-added)} 条。`)}catch(err){alert('导入失败：请使用本复习网页导出的 JSON，或字段包含日语答案的题库 JSON。')}e.target.value=''};
$('addForm').onsubmit=e=>{e.preventDefault();const x={id:'user-'+Date.now(),kind:'sentence',category:$('newCategory').value.trim()||'自定义',pattern:$('newPattern').value.trim(),prompt:$('newPrompt').value.trim(),cn:$('newPrompt').value.trim(),jp:$('newJP').value.trim(),hint:$('newHint').value.trim(),note:$('newNote').value.trim(),status:'todo',favorite:false,wrong:false,source:'手动新增'};items.unshift(x);persist();e.target.reset();$('newCategory').value='口语句型';render();$('cards').scrollIntoView({behavior:'smooth'})};
load();render();
</script></body></html>
